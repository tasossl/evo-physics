:root[data-skin="g16"]{--hacc:#F8B47A;}

:root[data-skin="n13"] .tile,:root[data-skin="n13"] .sim-btn,:root[data-skin="n13"] .cat-heading,:root[data-skin="g16"] .tile,:root[data-skin="g16"] .sim-btn,:root[data-skin="g16"] .cat-heading{--text:#E2E8F0;--textDim:#94A3B8;--panel:#1E293B;--panel2:#162033;--border:#334155;--atext:#F8B47A;}
:root{
  --accent-dim: color-mix(in srgb, var(--accent) 35%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    repeating-linear-gradient(var(--grid) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 32px);
  color: var(--htext);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

.wrap{max-width: 1180px; margin:0 auto; padding: 22px 18px 60px;}

header{
  border-bottom: 1px solid var(--grid);
  padding-bottom: 18px;
  margin-bottom: 20px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
h1{
  font-family:'Oswald', sans-serif;
  font-weight:600;
  letter-spacing: 0.02em;
  font-size: clamp(26px, 4.6vw, 38px);
  margin: 0 0 4px 0;
}
h1 span{color: var(--hacc, var(--atext));}
.byline{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  color: var(--hdim);
  margin-top:4px;
}
.subtitle{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color: var(--hdim);
}
.skin-wrap{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;}
.skin-select{
  text-align:center;text-align-last:center;
  background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 12px;font-family:'Inter',sans-serif;font-size:.85rem;
  min-width:200px;max-width:100%;cursor:pointer;
}
.skin-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* search */
.search-row{ margin: 20px 0 18px; }
.search-box{ position:relative; max-width: 520px; }
.search-box input{
  width:100%;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  padding: 13px 16px 13px 40px;
  border-radius: var(--radius);
  outline:none;
}
.search-box input::placeholder{color: var(--textDim);}
.search-box input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.search-box .icon{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color: var(--textDim); font-size:15px; pointer-events:none;
}
.result-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; color: var(--hdim); margin-top:8px; letter-spacing:0.04em;
}

/* tabs */
.tab-row{
  display:flex; gap:16px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1 1 0; min-width:max-content; text-align:center;
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.04em; text-transform:uppercase;
  padding:10px 16px; border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel); color: var(--textDim);
  cursor:pointer; white-space:nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.tab-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.tab-btn.active{background: var(--accent); color: var(--onAccent); border-color: var(--accent);}
.tab-btn:focus-visible{outline: 2px solid var(--accent); outline-offset:2px;}

.sub-tab-row{
  display:none; gap:6px; margin: 4px 0 20px; padding: 12px;
  background: var(--accent-soft);
  border: 1px dashed var(--accent-dim);
  border-radius: var(--radius);
  flex-wrap:wrap; align-items:center;
}
.sub-tab-row.show{display:flex;}
.sub-tab-row .lbl{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--hdim);
  letter-spacing:0.06em; text-transform:uppercase; margin-right:4px;
}
.sub-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:11.5px;
  letter-spacing:0.03em; text-transform:uppercase;
  padding:7px 13px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--textDim);
  cursor:pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.sub-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.sub-btn.active{background: var(--accent-dim); color: var(--text); border-color: var(--accent);}

/* section heading */
.section-title{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.1em;
  text-transform:uppercase; color: var(--hdim); margin: 26px 0 12px;
  display:flex; align-items:center; gap:10px;
}
.section-title::after{content:''; flex:1; height:1px; background: var(--grid);}

/* category tiles */
.tiles{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width:760px){ .tiles{grid-template-columns: repeat(2, 1fr);} }
@media (max-width:480px){ .tiles{grid-template-columns: 1fr;} }
.tile{
  position:relative; text-align:left; cursor:pointer;
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px 18px;
  min-height: 160px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;
  transition: border-color 0.15s, transform 0.15s;
  font: inherit;
}
.tile:hover{border-color: var(--accent); transform: translateY(-3px);}
.tile:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.tile-icon{display:block; width:44px; height:44px; color:var(--atext);}
.tile-icon svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;}
.tile-text{display:flex; flex-direction:column; align-items:center; gap:4px;}
.tile-name{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:20px;
  letter-spacing:0.02em; line-height:1.2;
}
.tile-count{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em;
  color: var(--textDim);
}
.tile.empty-cat .tile-count{opacity:.7;}

/* back bar */
.back-bar{display:none; align-items:center; gap:14px; margin: 6px 0 16px; flex-wrap:wrap;}
.back-bar.show{display:flex;}
.back-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.05em; text-transform:uppercase;
  padding:9px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor:pointer;
}
.back-btn:hover{border-color: var(--accent);}
.back-title{font-family:'Oswald', sans-serif; font-weight:600; font-size:22px;}

/* grid */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.grid[hidden]{display:none;}

.card{
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display:flex; flex-direction:column; gap:10px;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover{border-color: var(--accent); transform: translateY(-2px);}
.card-title{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:16.5px;
  color: var(--text); margin:0; line-height:1.3;
}
.card-desc{ font-size:13px; line-height:1.5; color: var(--textDim); flex:1; }

.badge-row, .tag-row{ display:flex; flex-wrap:wrap; gap:5px; }
.badge{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.03em;
  padding:3px 8px; border-radius:12px;
  background: color-mix(in srgb, var(--gridStrong) 22%, transparent);
  color: var(--text); border: 1px solid var(--border);
}
.tag{
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  padding:3px 8px; border-radius: var(--radius);
  background: transparent; color: var(--atext);
  border: 1px solid var(--accent-dim); cursor:pointer;
}
.tag:hover{background: var(--accent-soft);}

.card-open{
  margin-top:4px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.05em; text-transform:uppercase; text-decoration:none;

  padding: 10px 14px; border-radius: var(--radius);
  transition: filter 0.15s;
}

.empty{
  grid-column: 1 / -1; text-align:center; padding: 50px 20px;
  color: var(--textDim);
  font-family:'IBM Plex Mono', monospace; font-size:13px;

}

footer{
  margin-top: 40px; padding-top:16px; border-top: 1px solid var(--grid);
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--hdim);

/* ===== Στρογγυλεμένο UI · κουμπιά με μόνο τον τίτλο ===== */
:root{--r-pill:999px;--r-box:16px;}
.search-box input{border-radius:var(--r-pill);}
.skin-select{border-radius:var(--r-pill);}
.tab-row{flex-wrap:nowrap;gap:6px;justify-content:flex-start;padding:2px 2px 6px;margin-bottom:12px;}
@supports (justify-content: safe center){ .tab-row{justify-content:safe center;} }
.tab-btn{flex:0 0 auto;padding:6px 13px;font-size:11.5px;border-radius:var(--r-pill);letter-spacing:.03em;}
.sub-tab-row{border-radius:var(--r-box);width:fit-content;max-width:100%;margin:4px auto 16px;justify-content:center;}
.sub-btn{border-radius:var(--r-pill);padding:5px 12px;font-size:11px;}
.tile{border-radius:var(--r-box);}
.cat-heading{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;max-width:100%;margin:8px auto 18px;padding:9px 24px;font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em;color:var(--text);background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-box);}
.cat-heading[hidden]{display:none;}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.ico{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--atext);}
.ico-sm{width:26px;height:26px;}
.sim-btn:hover .ico{color:var(--onAccent);}
.sim-btn{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;min-height:96px;padding:14px 18px;font-family:'Oswald',sans-serif;font-weight:500;font-size:15.5px;line-height:1.3;letter-spacing:.02em;text-decoration:none;color:var(--text);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);transition:background .15s,color .15s,border-color .15s,transform .15s;}
.sim-btn:hover{background:var(--accent);color:var(--onAccent);border-color:var(--accent);transform:translateY(-2px);}
.sim-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:1180px;}
.tl{display:flex;gap:0;overflow-x:auto;padding:6px 4px 14px;margin:4px 0 14px;scrollbar-width:thin;}
.tl-item{flex:0 0 auto;width:92px;text-align:center;background:none;border:0;cursor:pointer;color:var(--textDim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:0;position:relative;}
.tl-item::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--accent-dim);}
.tl-item:first-child::before{left:50%;}
.tl-item:last-child::before{right:50%;}
.tl-dot{position:relative;display:block;width:11px;height:11px;margin:4px auto 8px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);transition:background .15s,transform .15s;}
.tl-item:hover .tl-dot,.tl-item:focus-visible .tl-dot{background:var(--accent);transform:scale(1.3);}
.tl-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
.tl-y{display:block;color:var(--htext);}
.tl-n{display:block;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.02em;color:var(--hdim);margin-top:2px;}
.era-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hdim);text-align:center;margin:-10px 0 16px;letter-spacing:.04em;}
.sci-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:26px;}
.sci{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px 18px;cursor:pointer;font:inherit;color:var(--text);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);transition:border-color .15s,transform .15s;}
.sci:hover{border-color:var(--accent);transform:translateY(-3px);}
.sci:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sci .av{width:76px;height:76px;color:var(--atext);}
.sci .emb{position:absolute;top:12px;right:12px;width:22px;height:22px;color:var(--atext);opacity:.8;}
.sci-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;letter-spacing:.02em;margin-top:4px;color:var(--text);}
.sci-years{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--textDim);letter-spacing:.04em;}
.sci-tag{font-size:13px;line-height:1.45;color:var(--textDim);}
.svg-i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.empty{text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--hdim);padding:40px 0;}
.detail{display:none;}
.detail.on{display:block;}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 14px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--textDim);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-pill);cursor:pointer;}
.back:hover{border-color:var(--accent);color:var(--text);}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.d-grid{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start;}
.d-side{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);padding:22px 18px;text-align:center;position:sticky;top:14px;}
.d-side .av{width:130px;height:130px;color:var(--atext);}
.d-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.02em;margin:8px 0 2px;color:var(--text);}
.d-name span{color:var(--atext);}
.d-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--textDim);line-height:1.7;}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:var(--r-pill);color:var(--atext);border:1px solid var(--accent-dim);}
.d-main{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-box);padding:16px 18px 20px;min-width:0;}
.d-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.d-body{color:var(--text);font-size:15px;line-height:1.7;}
.d-body p{margin:0 0 12px;}
.quote{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-box) var(--r-box) 0;color:var(--text);font-size:14px;line-height:1.6;}
.disc{display:grid;gap:10px;}
.disc-i{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-box);}
.disc-y{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--atext);font-weight:600;}
.disc-t{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;letter-spacing:.02em;margin-bottom:2px;}
.disc-d{font-size:13.5px;line-height:1.55;color:var(--textDim);}
.exp-h{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.exp-h .svg-i{width:24px;height:24px;color:var(--atext);}
.stage{margin:12px 0 8px;border:1px solid var(--border);border-radius:var(--r-box);overflow:hidden;background:var(--track);}
.stage canvas{display:block;width:100%;height:auto;}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--textDim);}
.ctl button{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;}
.ctl button:hover{border-color:var(--accent);}
.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ctl input[type=range]{accent-color:var(--accent);width:170px;}
.readout{margin-left:auto;color:var(--htext);}
.soon{padding:26px 16px;text-align:center;border:1px dashed var(--accent-dim);border-radius:var(--r-box);background:var(--accent-soft);color:var(--textDim);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
/* ===== Καρτέλα «Αναλυτικά» ===== */
.an-sec{margin:0 0 16px;padding:14px 16px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-box);}
.an-sec h4{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--text);}
.an-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--onAccent);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
.an-sec p{margin:0 0 10px;}
.an-sec ul{margin:0 0 10px;padding-left:20px;}
.an-sec li{margin:0 0 5px;}
.fm{margin:10px 0 12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-box) var(--r-box) 0;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text);overflow-x:auto;white-space:nowrap;}
.fm small{display:block;margin-top:4px;font-size:11.5px;color:var(--textDim);white-space:normal;}
.an-tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.an-tbl th,.an-tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);}
.an-tbl th:first-child,.an-tbl td:first-child{text-align:left;}
.an-tbl th{color:var(--textDim);font-weight:500;}
.an-calc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;padding:10px 12px;border:1px dashed var(--accent-dim);border-radius:var(--r-box);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--textDim);}
.an-calc input{width:90px;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;text-align:center;}
.an-calc input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.an-calc b{color:var(--atext);}
.fig{margin:12px 0 14px;padding:6px 6px 2px;border:1px solid var(--border);border-radius:var(--r-box);background:var(--track);}
.fig svg{display:block;width:100%;height:auto;}
.fig figcaption{padding:6px 10px 6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;color:var(--textDim);}
.fl{fill:none;stroke:var(--gridStrong);stroke-width:1.5;}
.fd{fill:none;stroke:var(--gridStrong);stroke-width:1;stroke-dasharray:4 4;}
.fg{stroke:var(--border);stroke-width:1;}
.fa{fill:none;stroke:var(--accent);stroke-width:2;}
.fb{fill:none;stroke:var(--blue);stroke-width:2;}
.fdash{stroke-dasharray:7 5;}
.fh{fill:var(--accent);stroke:none;}
.fs{fill:var(--accent);}
.fp{fill:var(--text);}
.fo{fill:var(--track);stroke:var(--gridStrong);stroke-width:1.5;}
.fz1{fill:var(--blue);fill-opacity:.38;stroke:var(--blue);stroke-width:1;}
.fz2{fill:var(--accent3);fill-opacity:.38;stroke:var(--accent3);stroke-width:1;}
.ft{fill:var(--textDim);font:12.5px 'IBM Plex Mono',monospace;}
.fx{fill:var(--text);font:13px 'IBM Plex Mono',monospace;}
.sci-on{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;color:var(--atext);margin-top:-2px;}
.d-on{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--atext);margin:0 0 4px;}
.partof{margin:46px 0 4px;border-top:1px solid var(--grid);padding-top:22px;}
.po-h{display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.3em;color:var(--hdim);text-transform:uppercase;margin-bottom:18px;}
.po-h::before,.po-h::after{content:"";flex:1;height:1px;background:var(--grid);}
.po-row{display:flex;justify-content:center;gap:clamp(14px,5vw,64px);flex-wrap:wrap;}
.po{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--htext);min-width:104px;}
.po-c{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--atext);transition:border-color .15s,transform .15s;}
.po-c .svg-i{width:34px;height:34px;}
.po:hover .po-c,.po:focus-visible .po-c{border-color:var(--accent);transform:translateY(-2px);}
.po:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px;}
.po.cur .po-c{border:2px solid var(--accent);}
.po-n{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;}
.po-n span{color:var(--atext);}
.po-s{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hdim);text-align:center;}
@media (max-width:760px){.d-grid{grid-template-columns:1fr;}.d-side{position:static;}.disc-i{grid-template-columns:1fr;gap:4px;}}

.wrap{padding-bottom:150px;}
.partof{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:7px 12px 9px;background:var(--bg);border-top:1px solid var(--border);}

.po-row{gap:clamp(10px,4vw,56px);}
.po{min-width:92px;gap:4px;}
.po-c{width:42px;height:42px;}

.po-n{font-size:12.5px;}
.po-s{font-size:10px;}

@media (max-width:760px),(max-height:500px){
  .wrap{padding-bottom:24px;}

const state = {era:'all', q:'', open:null};

function renderTabs(){
  const row = $('tabRow'); row.innerHTML = '';
  const mk = (id, label) => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.era===id?' active':'');
    b.textContent = label; b.onclick = () => { state.era = id; renderTabs(); renderList(); };
    row.appendChild(b);
  };
  mk('all','Όλες οι εποχές');
  ERAS.forEach(e => mk(e.id, e.n));
}

function filtered(){
  const q = norm(state.q).trim();
  return SCI.filter(s => (state.era==='all' || s.era===state.era) &&
    (!q || norm([s.n,s.on||'',s.ln,s.tag,s.tags.join(' '),s.place,s.disc.map(d=>d.t).join(' ')].join(' ')).includes(q)))
    .sort((a,b)=>a.b-b.b);
}

function renderList(){
  const list = filtered();
  $('tl').innerHTML = list.map(s => '<button class="tl-item" data-id="'+s.id+'"><span class="tl-dot"></span><span class="tl-y">'+s.yr.split(' – ')[0]+'</span><span class="tl-n">'+(TLN[s.id]||s.n.split(' ').slice(-1)[0])+'</span></button>').join('');
  const host = $('scis'); host.innerHTML = '';
  if (!list.length){ host.innerHTML = '<div class="empty">Δεν βρέθηκαν αποτελέσματα</div>'; return; }
  ERAS.forEach(e => {
    const items = list.filter(s => s.era===e.id);
    if (!items.length) return;
    host.insertAdjacentHTML('beforeend', '<div class="cat-heading">'+SVG(EMB[e.e],'ico ico-sm svg-i')+'<span>'+e.n+'</span></div><div class="era-note">'+e.r+'</div>');
    const g = document.createElement('div'); g.className = 'sci-grid';
    items.forEach(s => {
      const c = document.createElement('button'); c.className = 'sci'; c.dataset.id = s.id;
      c.innerHTML = avatar(s) + '<div class="sci-name">'+s.n+'</div>'+(s.on?'<div class="sci-on">'+s.on+'</div>':'')+'<div class="sci-years">'+s.yr+'</div><div class="sci-tag">'+s.tag+'</div>';
      g.appendChild(c);
    });
    host.appendChild(g);
  });
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('.sci,.tl-item');
  if (t && t.dataset.id) openSci(t.dataset.id);
});
$('searchInput').addEventListener('input', e => { state.q = e.target.value; renderList(); });

let tabNow = 'bio';
function openSci(id){
  const s = SCI.find(x => x.id===id); if (!s) return;
  state.open = id; tabNow = 'bio';
  $('listView').style.display = 'none';
  const dv = $('detailView'); dv.classList.add('on');
  const era = ERAS.find(e => e.id===s.era);
  dv.innerHTML = '<button class="back" id="backBtn">← Πίσω στη λίστα</button><div class="d-grid"><aside class="d-side">'+avatar(s)+'<div class="d-name">'+s.n+'</div>'+(s.on?'<div class="d-on">'+s.on+'</div>':'')+'<div class="d-meta">'+s.yr+'<br>'+s.place+'</div><div class="chips"><span class="chip">'+era.n+'</span>'+s.tags.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div></aside><section class="d-main"><div class="d-tabs" id="dTabs"></div><div class="d-body" id="dBody"></div></section></div>';
  $('backBtn').onclick = closeSci;
  renderDetail(s);
  window.scrollTo({top:0});
}
function closeSci(){
  stopAnim(); state.open = null;
  $('detailView').classList.remove('on'); $('detailView').innerHTML = '';
  $('listView').style.display = '';

function renderDetail(s){

/* ===== Αναλυτικά: ανά επιστήμονα, λίστα ενοτήτων {h: τίτλος, html: περιεχόμενο} =====

/* ===== Σχήματα SVG (χρώματα από το τρέχον skin μέσω κλάσεων) ===== */
const N1 = n => (+n).toFixed(1);
const T_ = (x,y,t,cls,anc) => '<text x="'+N1(x)+'" y="'+N1(y)+'" class="'+(cls||'ft')+'"'+(anc?' text-anchor="'+anc+'"':'')+'>'+t+'</text>';
const L_ = (x1,y1,x2,y2,cls) => '<line x1="'+N1(x1)+'" y1="'+N1(y1)+'" x2="'+N1(x2)+'" y2="'+N1(y2)+'" class="'+cls+'"/>';
const D_ = (x,y,r,cls) => '<circle cx="'+N1(x)+'" cy="'+N1(y)+'" r="'+r+'" class="'+cls+'"/>';
function AR_(x1,y1,x2,y2,cls){ const g = Math.atan2(y2-y1,x2-x1), s = 8, p = d => N1(x2-s*Math.cos(g+d))+','+N1(y2-s*Math.sin(g+d));
  return L_(x1,y1,x2,y2,cls)+'<polygon class="fh" points="'+N1(x2)+','+N1(y2)+' '+p(-0.4)+' '+p(0.4)+'"/>'; }
function FIG_(vb, inner, cap){ return '<figure class="fig"><svg viewBox="0 0 '+vb+'" role="img" aria-hidden="true">'+inner+'</svg><figcaption>'+cap+'</figcaption></figure>'; }

function figAnatomy(){
  const a=250, e=.8, c=a*e, b=a*Math.sqrt(1-e*e), cx=350, cy=170, sx=cx+c, th=125*Math.PI/180;
  const r = a*(1-e*e)/(1+e*Math.cos(th)), px = sx+r*Math.cos(th), py = cy-r*Math.sin(th);
  let s = '<ellipse class="fl" cx="'+cx+'" cy="'+cy+'" rx="'+a+'" ry="'+N1(b)+'"/>';
  s += L_(cx-a-12,cy,cx+a+12,cy,'fd')+L_(cx,cy-b-10,cx,cy+b+10,'fd');
  s += L_(cx-a,cy,cx,cy,'fb')+L_(cx,cy,cx,cy-b,'fb')+L_(cx,cy,sx,cy,'fa');
  s += T_(cx-a/2,cy-9,'a','fx','middle')+T_(cx+9,cy-b/2,'b','fx')+T_(cx+c/2,cy+21,'c','fx','middle');
  s += D_(cx,cy,3,'fp')+D_(cx-c,cy,5,'fo')+T_(cx-c,cy+22,'F₂','ft','middle');
  s += D_(cx-a,cy,3.5,'fp')+D_(cx+a,cy,3.5,'fp')+T_(cx-a,cy-14,'αφήλιο','ft','middle')+T_(cx+a,cy-14,'περιήλιο','ft','middle');
  s += L_(sx,cy,px,py,'fa')+'<path class="fd" d="M'+N1(sx+44)+','+cy+' A44 44 0 0 0 '+N1(sx+44*Math.cos(th))+','+N1(cy-44*Math.sin(th))+'"/>';
  s += T_(sx+62*Math.cos(1.1),cy-62*Math.sin(1.1),'θ','fx','middle')+T_((sx+px)/2+9,(cy+py)/2+6,'r','fx');
  s += D_(sx,cy,9,'fs')+T_(sx,cy+28,'F₁ · Ήλιος','ft','middle')+D_(px,py,6,'fp')+T_(px-12,py-9,'P','fx','end');
  return FIG_('700 340', s, 'Έλλειψη με τον Ήλιο στην εστία F₁. Εκκεντρότητα e = c/a. Για να φαίνεται καθαρά έχει σχεδιαστεί με e = 0,8, ενώ στους πλανήτες είναι πολύ μικρότερη.');
}
function figSectors(){
  const a=270, e=.75, b=a*Math.sqrt(1-e*e), c=a*e, cx=350, cy=195, sx=cx+c, dM=.55;
  const Ek = M => { let E = M; for (let i=0;i<40;i++) E -= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); return E; };
  const P = M => { const E = Ek(M); return [sx+a*(Math.cos(E)-e), cy-b*Math.sin(E)]; };
  const sec = (M0,cls) => { let d = 'M'+N1(sx)+','+cy; for (let i=0;i<=30;i++){ const q = P(M0-dM/2+dM*i/30); d += ' L'+N1(q[0])+','+N1(q[1]); } return '<path class="'+cls+'" d="'+d+' Z"/>'; };
  const pp = P(0), pa = P(Math.PI);
  let s = '<ellipse class="fl" cx="'+cx+'" cy="'+cy+'" rx="'+a+'" ry="'+N1(b)+'"/>'+sec(0,'fz1')+sec(Math.PI,'fz2');
  s += T_(sx+36,cy-24,'A₁','fx','middle')+T_(cx-30,cy+4,'A₂','fx','middle');
  s += D_(sx,cy,9,'fs')+T_(sx,cy+30,'Ήλιος','ft','middle');
  s += AR_(pp[0],pp[1],pp[0],pp[1]-76,'fa')+D_(pp[0],pp[1],6,'fp')+T_(pp[0]+12,pp[1]-52,'vπ','fx');
  s += AR_(pa[0],pa[1],pa[0],pa[1]+11,'fa')+D_(pa[0],pa[1],6,'fp')+T_(pa[0]+14,pa[1]+28,'vα','fx');
  return FIG_('700 390', s, 'Τα δύο σκιασμένα τμήματα διαγράφονται σε ίσους χρόνους, άρα έχουν ίσο εμβαδόν (A₁ = A₂). Κοντά στον Ήλιο το τμήμα είναι πλατύ και κοντό, μακριά του στενό και μακρύ. Τα βέλη δείχνουν την ταχύτητα, με το μήκος τους σε κλίμακα.');
}
function figLog(){
  const X0=72, X1=610, Y0=290, Y1=26, a0=.3, a1=12, t0=.2, t1=35, lg = Math.log10;
  const mx = a => X0+(lg(a)-lg(a0))/(lg(a1)-lg(a0))*(X1-X0), my = t => Y0-(lg(t)-lg(t0))/(lg(t1)-lg(t0))*(Y0-Y1);
  const fm = v => String(v).replace('.',',');
  let s = '';
  [.5,1,2,5,10].forEach(v => { s += L_(mx(v),Y0,mx(v),Y1,'fg')+T_(mx(v),Y0+18,fm(v),'ft','middle'); });
  [.3,1,3,10,30].forEach(v => { s += L_(X0,my(v),X1,my(v),'fg')+T_(X0-9,my(v)+4,fm(v),'ft','end'); });
  s += L_(X0,Y0,X1,Y0,'fl')+L_(X0,Y0,X0,Y1,'fl');
  s += L_(mx(Math.pow(t0,2/3)),my(t0),mx(Math.pow(t1,2/3)),my(t1),'fa fdash');

  s += T_(X1,Y0+38,'a (AU)','fx','end')+T_(X0+8,Y1+4,'T (έτη)','fx')+T_(mx(.42),my(9),'T = a^1,5 → ευθεία με κλίση 3/2','ft');
  return FIG_('660 335', s, 'Οι έξι πλανήτες σε λογαριθμικούς άξονες πέφτουν πάνω στην ίδια ευθεία. Αυτό σημαίνει T ∝ a^(3/2), δηλαδή T² ∝ a³.');
}
function figMars(){

      draw(c,W,H,K){ const oy = H/2+10, x0 = 40, x1 = W-40, k = 0.045, w = 3.2;
        c.strokeStyle = K.ln; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0,oy); c.lineTo(x1,oy); c.stroke();
        for (let x = x0; x<=x1; x += 13){ const a = Math.sin(k*(x-x0)-w*t)*95;
          c.strokeStyle = K.ac; c.lineWidth = 2; c.beginPath(); c.moveTo(x,oy); c.lineTo(x,oy-a); c.stroke();
          c.strokeStyle = K.bl; c.beginPath(); c.moveTo(x,oy); c.lineTo(x+a*0.45,oy+a*0.3); c.stroke(); }
        c.fillStyle = K.ac; c.font = '600 14px Inter,sans-serif'; c.fillText('E',W-80,38); c.fillStyle = K.bl; c.fillText('B',W-55,38); c.fillStyle = K.dim; c.fillText('→ διάδοση',W-120,H-18);
        return 'Ε ⟂ Β ⟂ διεύθυνση διάδοσης'; }
    };
  },
  rutherford(){
    const nx = 430, ny = 170, k = 450000, v = 190, bs = [-70,-48,-30,-16,-5,8,22,40,62];
    const spawn = (b,d) => ({b, x:-d, y:ny+b, vx:v, vy:0, tr:[], t:0});
    let ps = bs.map((b,i)=>spawn(b, 30+i*0)); ps.forEach((p,i)=>{ p.x = 12; p.t = -i*0.35; });
    return {
      controls:'',
      step(dt){ ps.forEach((p,i)=>{ if (p.t<0){ p.t += dt; return; } const n = 40, h = dt/n; for (let j=0;j<n;j++){ const dx = p.x-nx, dy = p.y-ny, r2 = dx*dx+dy*dy, r = Math.sqrt(r2); const a = k/(r2*r); p.vx += a*dx*h; p.vy += a*dy*h; p.x += p.vx*h; p.y += p.vy*h; }
        p.tr.push([p.x,p.y]); if (p.tr.length>80) p.tr.shift(); p.t += dt; if (p.x<-20||p.x>670||p.y<-20||p.y>360||p.t>6){ ps[i] = spawn(p.b,0); ps[i].x = 12; ps[i].t = -0.2; } }); },
      draw(c,W,H,K){ c.fillStyle = K.ac; c.beginPath(); c.arc(nx,ny,9,0,7); c.fill(); c.fillStyle = K.bg; c.font = '700 13px Inter,sans-serif'; c.textAlign = 'center'; c.fillText('+',nx,ny+4.5); c.textAlign = 'left';
        ps.forEach(p=>{ if (p.t<0) return; c.strokeStyle = K.bl+'99'; c.lineWidth = 1.5; c.beginPath(); p.tr.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])); c.stroke(); c.fillStyle = K.bl; c.beginPath(); c.arc(p.x,p.y,4,0,7); c.fill(); });
        return 'Σωματίδια α και πυρήνας (+)'; }
    };
  },
  decay(){
    const cols = 24, rows = 10, N = cols*rows, T12 = 2; let alive, t, hist;
    const reset = () => { alive = new Array(N).fill(true); t = 0; hist = [[0,N]]; }; reset();
    return {
      controls:'<button id="rs">Επανεκκίνηση</button>',
      bind(){ $('rs').onclick = reset; },
      step(dt){ if (t>5*T12) { reset(); } const p = 1-Math.pow(2,-dt/T12); alive.forEach((a,i)=>{ if (a && Math.random()<p) alive[i] = false; }); t += dt; hist.push([t, alive.filter(Boolean).length]); },
      draw(c,W,H,K){ const gx = 30, gy = 22, cell = 18;
        alive.forEach((a,i)=>{ const x = gx+(i%cols)*cell+cell/2, y = gy+Math.floor(i/cols)*cell+cell/2; c.fillStyle = a?K.ac:K.ln+'55'; c.beginPath(); c.arc(x,y,6,0,7); c.fill(); });
        const cx = 30, cy = 322, cw = W-60, ch = 70; c.strokeStyle = K.ln; c.lineWidth = 1; c.beginPath(); c.moveTo(cx,cy-ch); c.lineTo(cx,cy); c.lineTo(cx+cw,cy); c.stroke();
        c.setLineDash([4,4]); c.strokeStyle = K.dim; c.beginPath(); for (let i=0;i<=100;i++){ const tt = i/100*5*T12, y = cy-ch*Math.pow(2,-tt/T12); i?c.lineTo(cx+cw*i/100,y):c.moveTo(cx,y); } c.stroke(); c.setLineDash([]);
        c.strokeStyle = K.ac; c.lineWidth = 2; c.beginPath(); hist.forEach((h,i)=>{ const x = cx+cw*h[0]/(5*T12), y = cy-ch*h[1]/N; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
        c.fillStyle = K.dim; c.font = '12px Inter,sans-serif'; c.fillText('N(t) · διακεκομμένη: θεωρία',cx+6,cy-ch-6);
        return 'Ν = '+alive.filter(Boolean).length+' από '+N+' · t₁/₂ = 2 s'; }
    };
  },
  eratosthenes(){
    let t = 0;
    return {
      controls:'',
      step(dt){ t += dt; },
      draw(c,W,H,K){ const cx = W/2+30, cy = 215, R = 112, ang = 0.5, sx = cx, sy = cy-R, ax = cx+R*Math.sin(ang), ay = cy-R*Math.cos(ang);
        const surf = x => cy-Math.sqrt(Math.max(0,R*R-(x-cx)*(x-cx)));
        c.strokeStyle = K.ln; c.lineWidth = 1.5; c.beginPath(); c.arc(cx,cy,R,0,7); c.stroke();
        const tipx = ax+24*Math.sin(ang), tipy = ay-24*Math.cos(ang), hitx = tipx, hity = surf(hitx);
        c.strokeStyle = K.ac; c.lineWidth = 1.5; c.setLineDash([7,6]); c.lineDashOffset = -t*40;
        [sx-40,sx-20,sx,sx+20,sx+40,ax+50].forEach(x=>{ c.beginPath(); c.moveTo(x,12); c.lineTo(x,surf(x)); c.stroke(); });
        c.beginPath(); c.moveTo(tipx,12); c.lineTo(tipx,hity); c.stroke();
        c.setLineDash([]); c.lineDashOffset = 0;
        c.strokeStyle = K.er; c.lineWidth = 3; c.beginPath(); c.moveTo(ax,ay); c.lineTo(hitx,hity); c.stroke();
        const stick = (x,y,a)=>{ c.strokeStyle = K.tx; c.lineWidth = 3; c.beginPath(); c.moveTo(x,y); c.lineTo(x+24*Math.sin(a),y-24*Math.cos(a)); c.stroke(); };
        stick(sx,sy,0); stick(ax,ay,ang);
        c.strokeStyle = K.dim; c.lineWidth = 1; c.beginPath(); c.moveTo(cx,cy); c.lineTo(sx,sy); c.moveTo(cx,cy); c.lineTo(ax,ay); c.stroke();
        c.beginPath(); c.arc(cx,cy,34,-Math.PI/2,-Math.PI/2+ang); c.stroke();
        c.fillStyle = K.tx; c.font = '13px Inter,sans-serif'; c.fillText('Συήνη',sx-62,sy+4); c.fillText('Αλεξάνδρεια',ax+14,ay+14); c.fillText('θ',cx+8,cy-40); c.fillStyle = K.dim; c.fillText('ακτίνες Ήλιου (παράλληλες)',20,24);
        c.fillStyle = K.er; c.fillText('σκιά',ax+30,ay-30);
        return 'θ ≈ 7,2° = 1/50 του κύκλου → 50 × 5000 σταδ. ≈ 250.000 σταδ.'; }
    };
  }
};

function startAnim(key){
  stopAnim();
  const cv = $('cv'), c = cv.getContext('2d'), W = cv.width, H = cv.height, A = MAKERS[key](); cur = A;
  let running = true, last = performance.now();
  $('ctl').innerHTML = '<button id="pp">Παύση</button>' + A.controls + '<span class="readout" id="ro"></span>';
  $('pp').onclick = () => { running = !running; $('pp').textContent = running ? 'Παύση' : 'Εκκίνηση'; };
  if (A.bind) A.bind();
  const loop = now => {
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    if (running) A.step(dt);
    const K = C(); c.fillStyle = K.bg; c.fillRect(0,0,W,H);
    const ro = A.draw(c,W,H,K); const r = $('ro'); if (r) r.textContent = ro||'';
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
