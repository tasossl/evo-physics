    return {
      controls:'',
      step(dt){ ps.forEach((p,i)=>{ if (p.t<0){ p.t += dt; return; } const n = 40, h = dt/n; for (let j=0;j<n;j++){ const dx = p.x-nx, dy = p.y-ny, r2 = dx*dx+dy*dy, r = Math.sqrt(r2); const a = k/(r2*r); p.vx += a*dx*h; p.vy += a*dy*h; p.x += p.vx*h; p.y += p.vy*h; }
        p.tr.push([p.x,p.y]); if (p.tr.length>80) p.tr.shift(); p.t += dt; if (p.x<-20||p.x>670||p.y<-20||p.y>360||p.t>6){ ps[i] = spawn(p.b,0); ps[i].x = 12; ps[i].t = -0.2; } }); },
      draw(c,W,H,K){ c.fillStyle = K.ac; c.beginPath(); c.arc(nx,ny,9,0,7); c.fill(); c.fillStyle = K.bg; c.font = '700 13px Inter,sans-serif'; c.textAlign = 'center'; c.fillText('+',nx,ny+4.5); c.textAlign = 'left';
        ps.forEach(p=>{ if (p.t<0) return; c.strokeStyle = K.bl+'99'; c.lineWidth = 1.5; c.beginPath(); p.tr.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])); c.stroke(); c.fillStyle = K.bl; c.beginPath(); c.arc(p.x,p.y,4,0,7); c.fill(); });
        return 'Σωματίδια α και πυρήνας (+)'; }
    };
  },
  decay(){
    const cols = 24, rows = 10, N = cols*rows, T12 = 2; let alive, t, hist;
    const reset = () => { alive = new Array(N).fill(true); t = 0; hist = [[0,N]]; }; reset();
    return {
      controls:'<button id="rs">Επανεκκίνηση</button>',
      bind(){ $('rs').onclick = reset; },
      step(dt){ if (t>5*T12) { reset(); } const p = 1-Math.pow(2,-dt/T12); alive.forEach((a,i)=>{ if (a && Math.random()<p) alive[i] = false; }); t += dt; hist.push([t, alive.filter(Boolean).length]); },
      draw(c,W,H,K){ const gx = 30, gy = 22, cell = 18;
        alive.forEach((a,i)=>{ const x = gx+(i%cols)*cell+cell/2, y = gy+Math.floor(i/cols)*cell+cell/2; c.fillStyle = a?K.ac:K.ln+'55'; c.beginPath(); c.arc(x,y,6,0,7); c.fill(); });
        const cx = 30, cy = 322, cw = W-60, ch = 70; c.strokeStyle = K.ln; c.lineWidth = 1; c.beginPath(); c.moveTo(cx,cy-ch); c.lineTo(cx,cy); c.lineTo(cx+cw,cy); c.stroke();
        c.setLineDash([4,4]); c.strokeStyle = K.dim; c.beginPath(); for (let i=0;i<=100;i++){ const tt = i/100*5*T12, y = cy-ch*Math.pow(2,-tt/T12); i?c.lineTo(cx+cw*i/100,y):c.moveTo(cx,y); } c.stroke(); c.setLineDash([]);
        c.strokeStyle = K.ac; c.lineWidth = 2; c.beginPath(); hist.forEach((h,i)=>{ const x = cx+cw*h[0]/(5*T12), y = cy-ch*h[1]/N; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
        c.fillStyle = K.dim; c.font = '12px Inter,sans-serif'; c.fillText('N(t) · διακεκομμένη: θεωρία',cx+6,cy-ch-6);
        return 'Ν = '+alive.filter(Boolean).length+' από '+N+' · t₁/₂ = 2 s'; }
    };
  },
  eratosthenes(){
    let t = 0;
    return {
      controls:'',
      step(dt){ t += dt; },
      draw(c,W,H,K){ const cx = W/2+30, cy = 215, R = 112, ang = 0.5, sx = cx, sy = cy-R, ax = cx+R*Math.sin(ang), ay = cy-R*Math.cos(ang);
        const surf = x => cy-Math.sqrt(Math.max(0,R*R-(x-cx)*(x-cx)));
        c.strokeStyle = K.ln; c.lineWidth = 1.5; c.beginPath(); c.arc(cx,cy,R,0,7); c.stroke();
        const tipx = ax+24*Math.sin(ang), tipy = ay-24*Math.cos(ang), hitx = tipx, hity = surf(hitx);
        c.strokeStyle = K.ac; c.lineWidth = 1.5; c.setLineDash([7,6]); c.lineDashOffset = -t*40;
        [sx-40,sx-20,sx,sx+20,sx+40,ax+50].forEach(x=>{ c.beginPath(); c.moveTo(x,12); c.lineTo(x,surf(x)); c.stroke(); });
        c.beginPath(); c.moveTo(tipx,12); c.lineTo(tipx,hity); c.stroke();
        c.setLineDash([]); c.lineDashOffset = 0;
        c.strokeStyle = K.er; c.lineWidth = 3; c.beginPath(); c.moveTo(ax,ay); c.lineTo(hitx,hity); c.stroke();
        const stick = (x,y,a)=>{ c.strokeStyle = K.tx; c.lineWidth = 3; c.beginPath(); c.moveTo(x,y); c.lineTo(x+24*Math.sin(a),y-24*Math.cos(a)); c.stroke(); };
        stick(sx,sy,0); stick(ax,ay,ang);
        c.strokeStyle = K.dim; c.lineWidth = 1; c.beginPath(); c.moveTo(cx,cy); c.lineTo(sx,sy); c.moveTo(cx,cy); c.lineTo(ax,ay); c.stroke();
        c.beginPath(); c.arc(cx,cy,34,-Math.PI/2,-Math.PI/2+ang); c.stroke();
        c.fillStyle = K.tx; c.font = '13px Inter,sans-serif'; c.fillText('Συήνη',sx-62,sy+4); c.fillText('Αλεξάνδρεια',ax+14,ay+14); c.fillText('θ',cx+8,cy-40); c.fillStyle = K.dim; c.fillText('ακτίνες Ήλιου (παράλληλες)',20,24);
        c.fillStyle = K.er; c.fillText('σκιά',ax+30,ay-30);
        return 'θ ≈ 7,2° = 1/50 του κύκλου → 50 × 5000 σταδ. ≈ 250.000 σταδ.'; }
    };
  }
};

function startAnim(key){
  stopAnim();
  const cv = $('cv'), c = cv.getContext('2d'), W = cv.width, H = cv.height, A = MAKERS[key](); cur = A;
  let running = true, last = performance.now();
  $('ctl').innerHTML = '<button id="pp">Παύση</button>' + A.controls + '<span class="readout" id="ro"></span>';
  $('pp').onclick = () => { running = !running; $('pp').textContent = running ? 'Παύση' : 'Εκκίνηση'; };
  if (A.bind) A.bind();
  const loop = now => {
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    if (running) A.step(dt);
    const K = C(); c.fillStyle = K.bg; c.fillRect(0,0,W,H);
    const ro = A.draw(c,W,H,K); const r = $('ro'); if (r) r.textContent = ro||'';
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
