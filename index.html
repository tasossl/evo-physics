:root[data-skin="g16"]{--hacc:#F8B47A;}

:root[data-skin="n13"] .tile,:root[data-skin="n13"] .sim-btn,:root[data-skin="n13"] .cat-heading,:root[data-skin="g16"] .tile,:root[data-skin="g16"] .sim-btn,:root[data-skin="g16"] .cat-heading{--text:#E2E8F0;--textDim:#94A3B8;--panel:#1E293B;--panel2:#162033;--border:#334155;--atext:#F8B47A;}
:root{
  --accent-dim: color-mix(in srgb, var(--accent) 35%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    repeating-linear-gradient(var(--grid) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 32px);
  color: var(--htext);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

.wrap{max-width: 1180px; margin:0 auto; padding: 22px 18px 60px;}

header{
  border-bottom: 1px solid var(--grid);
  padding-bottom: 18px;
  margin-bottom: 20px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
h1{
  font-family:'Oswald', sans-serif;
  font-weight:600;
  letter-spacing: 0.02em;
  font-size: clamp(26px, 4.6vw, 38px);
  margin: 0 0 4px 0;
}
h1 span{color: var(--hacc, var(--atext));}
.byline{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  color: var(--hdim);
  margin-top:4px;
}
.subtitle{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color: var(--hdim);
}
.skin-wrap{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;}
.skin-select{
  text-align:center;text-align-last:center;
  background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 12px;font-family:'Inter',sans-serif;font-size:.85rem;
  min-width:200px;max-width:100%;cursor:pointer;
}
.skin-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* search */
.search-row{ margin: 20px 0 18px; }
.search-box{ position:relative; max-width: 520px; }
.search-box input{
  width:100%;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  padding: 13px 16px 13px 40px;
  border-radius: var(--radius);
  outline:none;
}
.search-box input::placeholder{color: var(--textDim);}
.search-box input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.search-box .icon{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color: var(--textDim); font-size:15px; pointer-events:none;
}
.result-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; color: var(--hdim); margin-top:8px; letter-spacing:0.04em;
}

/* tabs */
.tab-row{
  display:flex; gap:16px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1 1 0; min-width:max-content; text-align:center;
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.04em; text-transform:uppercase;
  padding:10px 16px; border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel); color: var(--textDim);
  cursor:pointer; white-space:nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.tab-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.tab-btn.active{background: var(--accent); color: var(--onAccent); border-color: var(--accent);}
.tab-btn:focus-visible{outline: 2px solid var(--accent); outline-offset:2px;}

.sub-tab-row{
  display:none; gap:6px; margin: 4px 0 20px; padding: 12px;
  background: var(--accent-soft);
  border: 1px dashed var(--accent-dim);
  border-radius: var(--radius);
  flex-wrap:wrap; align-items:center;
}
.sub-tab-row.show{display:flex;}
.sub-tab-row .lbl{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--hdim);
  letter-spacing:0.06em; text-transform:uppercase; margin-right:4px;
}
.sub-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:11.5px;
  letter-spacing:0.03em; text-transform:uppercase;
  padding:7px 13px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--textDim);
  cursor:pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.sub-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.sub-btn.active{background: var(--accent-dim); color: var(--text); border-color: var(--accent);}

/* section heading */
.section-title{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.1em;
  text-transform:uppercase; color: var(--hdim); margin: 26px 0 12px;
  display:flex; align-items:center; gap:10px;
}
.section-title::after{content:''; flex:1; height:1px; background: var(--grid);}

/* category tiles */
.tiles{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width:760px){ .tiles{grid-template-columns: repeat(2, 1fr);} }
@media (max-width:480px){ .tiles{grid-template-columns: 1fr;} }
.tile{
  position:relative; text-align:left; cursor:pointer;
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px 18px;
  min-height: 160px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;
  transition: border-color 0.15s, transform 0.15s;
  font: inherit;
}
.tile:hover{border-color: var(--accent); transform: translateY(-3px);}
.tile:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.tile-icon{display:block; width:44px; height:44px; color:var(--atext);}
.tile-icon svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;}
.tile-text{display:flex; flex-direction:column; align-items:center; gap:4px;}
.tile-name{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:20px;
  letter-spacing:0.02em; line-height:1.2;
}
.tile-count{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em;
  color: var(--textDim);
}
.tile.empty-cat .tile-count{opacity:.7;}

/* back bar */
.back-bar{display:none; align-items:center; gap:14px; margin: 6px 0 16px; flex-wrap:wrap;}
.back-bar.show{display:flex;}
.back-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.05em; text-transform:uppercase;
  padding:9px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor:pointer;
}
.back-btn:hover{border-color: var(--accent);}
.back-title{font-family:'Oswald', sans-serif; font-weight:600; font-size:22px;}

/* grid */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.grid[hidden]{display:none;}

.card{
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display:flex; flex-direction:column; gap:10px;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover{border-color: var(--accent); transform: translateY(-2px);}
.card-title{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:16.5px;
  color: var(--text); margin:0; line-height:1.3;
}
.card-desc{ font-size:13px; line-height:1.5; color: var(--textDim); flex:1; }

.badge-row, .tag-row{ display:flex; flex-wrap:wrap; gap:5px; }
.badge{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.03em;
  padding:3px 8px; border-radius:12px;
  background: color-mix(in srgb, var(--gridStrong) 22%, transparent);
  color: var(--text); border: 1px solid var(--border);
}
.tag{
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  padding:3px 8px; border-radius: var(--radius);
  background: transparent; color: var(--atext);

/* ===== Στρογγυλεμένο UI · κουμπιά με μόνο τον τίτλο ===== */
:root{--r-pill:999px;--r-box:16px;}

.tab-row{flex-wrap:nowrap;gap:6px;justify-content:flex-start;padding:2px 2px 6px;margin-bottom:12px;}

.tab-btn{flex:0 0 auto;padding:6px 13px;font-size:11.5px;border-radius:var(--r-pill);letter-spacing:.03em;}
.sub-tab-row{border-radius:var(--r-box);width:fit-content;max-width:100%;margin:4px auto 16px;justify-content:center;}

.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.ico{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--atext);}
.ico-sm{width:26px;height:26px;}
.sim-btn:hover .ico{color:var(--onAccent);}
.sim-btn{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;min-height:96px;padding:14px 18px;font-family:'Oswald',sans-serif;font-weight:500;font-size:15.5px;line-height:1.3;letter-spacing:.02em;text-decoration:none;color:var(--text);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);transition:background .15s,color .15s,border-color .15s,transform .15s;}
.sim-btn:hover{background:var(--accent);color:var(--onAccent);border-color:var(--accent);transform:translateY(-2px);}
.sim-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:1180px;}
.tl{display:flex;gap:0;overflow-x:auto;padding:6px 4px 14px;margin:4px 0 14px;scrollbar-width:thin;}
.tl-item{flex:0 0 auto;width:92px;text-align:center;background:none;border:0;cursor:pointer;color:var(--textDim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:0;position:relative;}
.tl-item::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--accent-dim);}
.tl-item:first-child::before{left:50%;}
.tl-item:last-child::before{right:50%;}
.tl-dot{position:relative;display:block;width:11px;height:11px;margin:4px auto 8px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);transition:background .15s,transform .15s;}
.tl-item:hover .tl-dot,.tl-item:focus-visible .tl-dot{background:var(--accent);transform:scale(1.3);}
.tl-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
.tl-y{display:block;color:var(--htext);}

.sci{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px 18px;cursor:pointer;font:inherit;color:var(--text);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);transition:border-color .15s,transform .15s;}

.svg-i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.empty{text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--hdim);padding:40px 0;}
.detail{display:none;}

.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 14px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--textDim);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-pill);cursor:pointer;}

.d-side .av{width:130px;height:130px;color:var(--atext);}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:var(--r-pill);color:var(--atext);border:1px solid var(--accent-dim);}
.d-main{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-box);padding:16px 18px 20px;min-width:0;}

.quote{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-box) var(--r-box) 0;color:var(--text);font-size:14px;line-height:1.6;}
.disc{display:grid;gap:10px;}

.disc-y{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--atext);font-weight:600;}
.disc-t{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;letter-spacing:.02em;margin-bottom:2px;}
.disc-d{font-size:13.5px;line-height:1.55;color:var(--textDim);}
.exp-h{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.exp-h .svg-i{width:24px;height:24px;color:var(--atext);}
.stage{margin:12px 0 8px;border:1px solid var(--border);border-radius:var(--r-box);overflow:hidden;background:var(--track);}
.stage canvas{display:block;width:100%;height:auto;}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--textDim);}
.ctl button{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;}
.ctl button:hover{border-color:var(--accent);}
.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ctl input[type=range]{accent-color:var(--accent);width:170px;}
.readout{margin-left:auto;color:var(--htext);}
.soon{padding:26px 16px;text-align:center;border:1px dashed var(--accent-dim);border-radius:var(--r-box);background:var(--accent-soft);color:var(--textDim);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
/* ===== Καρτέλα «Αναλυτικά» ===== */
.an-sec{margin:0 0 16px;padding:14px 16px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-box);}
.an-sec h4{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--text);}
.an-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--onAccent);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
.an-sec p{margin:0 0 10px;}
.an-sec ul{margin:0 0 10px;padding-left:20px;}
.an-sec li{margin:0 0 5px;}
.fm{margin:10px 0 12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-box) var(--r-box) 0;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text);overflow-x:auto;white-space:nowrap;}
.fm small{display:block;margin-top:4px;font-size:11.5px;color:var(--textDim);white-space:normal;}

.an-tbl th:first-child,.an-tbl td:first-child{text-align:left;}

.an-calc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;padding:10px 12px;border:1px dashed var(--accent-dim);border-radius:var(--r-box);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--textDim);}
.an-calc input{width:90px;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;text-align:center;}
.an-calc input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.an-calc b{color:var(--atext);}
.fig{margin:12px 0 14px;padding:6px 6px 2px;border:1px solid var(--border);border-radius:var(--r-box);background:var(--track);}

.fl{fill:none;stroke:var(--gridStrong);stroke-width:1.5;}

const state = {era:'all', q:'', open:null};

function renderTabs(){
  const row = $('tabRow'); row.innerHTML = '';
  const mk = (id, label) => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.era===id?' active':'');
    b.textContent = label; b.onclick = () => { state.era = id; renderTabs(); renderList(); };
    row.appendChild(b);
  };
  mk('all','Όλες οι εποχές');
  ERAS.forEach(e => mk(e.id, e.n));
}

function filtered(){
  const q = norm(state.q).trim();
  return SCI.filter(s => (state.era==='all' || s.era===state.era) &&
    (!q || norm([s.n,s.on||'',s.ln,s.tag,s.tags.join(' '),s.place,s.disc.map(d=>d.t).join(' ')].join(' ')).includes(q)))
    .sort((a,b)=>a.b-b.b);
}

function renderList(){
  const list = filtered();
  $('tl').innerHTML = list.map(s => '<button class="tl-item" data-id="'+s.id+'"><span class="tl-dot"></span><span class="tl-y">'+s.yr.split(' – ')[0]+'</span><span class="tl-n">'+(TLN[s.id]||s.n.split(' ').slice(-1)[0])+'</span></button>').join('');
  const host = $('scis'); host.innerHTML = '';
  if (!list.length){ host.innerHTML = '<div class="empty">Δεν βρέθηκαν αποτελέσματα</div>'; return; }
  ERAS.forEach(e => {
    const items = list.filter(s => s.era===e.id);
    if (!items.length) return;
    host.insertAdjacentHTML('beforeend', '<div class="cat-heading">'+SVG(EMB[e.e],'ico ico-sm svg-i')+'<span>'+e.n+'</span></div><div class="era-note">'+e.r+'</div>');
    const g = document.createElement('div'); g.className = 'sci-grid';
    items.forEach(s => {
      const c = document.createElement('button'); c.className = 'sci'; c.dataset.id = s.id;
      c.innerHTML = avatar(s) + '<div class="sci-name">'+s.n+'</div>'+(s.on?'<div class="sci-on">'+s.on+'</div>':'')+'<div class="sci-years">'+s.yr+'</div><div class="sci-tag">'+s.tag+'</div>';
      g.appendChild(c);
    });
    host.appendChild(g);
  });
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('.sci,.tl-item');
  if (t && t.dataset.id) openSci(t.dataset.id);
});
$('searchInput').addEventListener('input', e => { state.q = e.target.value; renderList(); });

let tabNow = 'bio';
function openSci(id){
  const s = SCI.find(x => x.id===id); if (!s) return;
  state.open = id; tabNow = 'bio';
  $('listView').style.display = 'none';
  const dv = $('detailView'); dv.classList.add('on');
  const era = ERAS.find(e => e.id===s.era);
  dv.innerHTML = '<button class="back" id="backBtn">← Πίσω στη λίστα</button><div class="d-grid"><aside class="d-side">'+avatar(s)+'<div class="d-name">'+s.n+'</div>'+(s.on?'<div class="d-on">'+s.on+'</div>':'')+'<div class="d-meta">'+s.yr+'<br>'+s.place+'</div><div class="chips"><span class="chip">'+era.n+'</span>'+s.tags.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div></aside><section class="d-main"><div class="d-tabs" id="dTabs"></div><div class="d-body" id="dBody"></div></section></div>';
  $('backBtn').onclick = closeSci;
  renderDetail(s);
  window.scrollTo({top:0});
}
function closeSci(){
  stopAnim(); state.open = null;
  $('detailView').classList.remove('on'); $('detailView').innerHTML = '';
  $('listView').style.display = '';
}
function renderDetail(s){
  const tabs = [['bio','Ιστορία'],['disc','Ανακαλύψεις'],['an','Αναλυτικά'],['exp','Πείραμα · Animation']];
  const tb = $('dTabs'); tb.innerHTML = '';
  tabs.forEach(t => { const b = document.createElement('button'); b.className = 'tab-btn' + (tabNow===t[0]?' active':''); b.textContent = t[1]; b.onclick = () => { tabNow = t[0]; renderDetail(s); }; tb.appendChild(b); });
  stopAnim();
  const body = $('dBody');
  if (tabNow==='bio') body.innerHTML = s.bio.map(p=>'<p>'+p+'</p>').join('') + (s.q ? '<div class="quote">'+s.q+'</div>' : '');
  if (tabNow==='disc') body.innerHTML = '<div class="disc">'+s.disc.map(d=>'<div class="disc-i"><div class="disc-y">'+d.y+'</div><div><div class="disc-t">'+d.t+'</div><div class="disc-d">'+d.d+'</div></div></div>').join('')+'</div>';
  if (tabNow==='an'){
    const A = AN[s.id];
    body.innerHTML = A ? A.map((x,i)=>'<section class="an-sec"><h4><span class="an-n">'+(i+1)+'</span>'+x.h+'</h4>'+x.html+'</section>').join('')
      : '<div class="soon">Η αναλυτική εξήγηση των ανακαλύψεων του/της «'+s.n+'» θα προστεθεί σύντομα.</div>';
    if (A && AN_BIND[s.id]) AN_BIND[s.id]();
  }
  if (tabNow==='exp'){
    body.innerHTML = '<h3 class="exp-h">'+SVG(EMB[s.id])+s.ex.t+'</h3><p>'+s.ex.d+'</p>' +
      (s.ex.a ? '<div class="stage"><canvas id="cv" width="640" height="340"></canvas></div><div class="ctl" id="ctl"></div>' : '<div class="soon">Η διαδραστική προσομοίωση αυτού του πειράματος θα προστεθεί σύντομα.</div>');
    if (s.ex.a) startAnim(s.ex.a);
  }
}

/* ===== Αναλυτικά: ανά επιστήμονα, λίστα ενοτήτων {h: τίτλος, html: περιεχόμενο} =====
   Όποιος δεν έχει εγγραφή εδώ δείχνει «θα προστεθεί σύντομα». Προσθέτεις νέα εγγραφή με το id του επιστήμονα. */
/* ===== Σχήματα SVG (χρώματα από το τρέχον skin μέσω κλάσεων) ===== */
const N1 = n => (+n).toFixed(1);
const T_ = (x,y,t,cls,anc) => '<text x="'+N1(x)+'" y="'+N1(y)+'" class="'+(cls||'ft')+'"'+(anc?' text-anchor="'+anc+'"':'')+'>'+t+'</text>';
const L_ = (x1,y1,x2,y2,cls) => '<line x1="'+N1(x1)+'" y1="'+N1(y1)+'" x2="'+N1(x2)+'" y2="'+N1(y2)+'" class="'+cls+'"/>';
const D_ = (x,y,r,cls) => '<circle cx="'+N1(x)+'" cy="'+N1(y)+'" r="'+r+'" class="'+cls+'"/>';
function AR_(x1,y1,x2,y2,cls){ const g = Math.atan2(y2-y1,x2-x1), s = 8, p = d => N1(x2-s*Math.cos(g+d))+','+N1(y2-s*Math.sin(g+d));
  return L_(x1,y1,x2,y2,cls)+'<polygon class="fh" points="'+N1(x2)+','+N1(y2)+' '+p(-0.4)+' '+p(0.4)+'"/>'; }
function FIG_(vb, inner, cap){ return '<figure class="fig"><svg viewBox="0 0 '+vb+'" role="img" aria-hidden="true">'+inner+'</svg><figcaption>'+cap+'</figcaption></figure>'; }

function figAnatomy(){
  const a=250, e=.8, c=a*e, b=a*Math.sqrt(1-e*e), cx=350, cy=170, sx=cx+c, th=125*Math.PI/180;
  const r = a*(1-e*e)/(1+e*Math.cos(th)), px = sx+r*Math.cos(th), py = cy-r*Math.sin(th);
  let s = '<ellipse class="fl" cx="'+cx+'" cy="'+cy+'" rx="'+a+'" ry="'+N1(b)+'"/>';
  s += L_(cx-a-12,cy,cx+a+12,cy,'fd')+L_(cx,cy-b-10,cx,cy+b+10,'fd');
  s += L_(cx-a,cy,cx,cy,'fb')+L_(cx,cy,cx,cy-b,'fb')+L_(cx,cy,sx,cy,'fa');
  s += T_(cx-a/2,cy-9,'a','fx','middle')+T_(cx+9,cy-b/2,'b','fx')+T_(cx+c/2,cy+21,'c','fx','middle');
  s += D_(cx,cy,3,'fp')+D_(cx-c,cy,5,'fo')+T_(cx-c,cy+22,'F₂','ft','middle');
  s += D_(cx-a,cy,3.5,'fp')+D_(cx+a,cy,3.5,'fp')+T_(cx-a,cy-14,'αφήλιο','ft','middle')+T_(cx+a,cy-14,'περιήλιο','ft','middle');
  s += L_(sx,cy,px,py,'fa')+'<path class="fd" d="M'+N1(sx+44)+','+cy+' A44 44 0 0 0 '+N1(sx+44*Math.cos(th))+','+N1(cy-44*Math.sin(th))+'"/>';
  s += T_(sx+62*Math.cos(1.1),cy-62*Math.sin(1.1),'θ','fx','middle')+T_((sx+px)/2+9,(cy+py)/2+6,'r','fx');
  s += D_(sx,cy,9,'fs')+T_(sx,cy+28,'F₁ · Ήλιος','ft','middle')+D_(px,py,6,'fp')+T_(px-12,py-9,'P','fx','end');
  return FIG_('700 340', s, 'Έλλειψη με τον Ήλιο στην εστία F₁. Εκκεντρότητα e = c/a. Για να φαίνεται καθαρά έχει σχεδιαστεί με e = 0,8, ενώ στους πλανήτες είναι πολύ μικρότερη.');
}
function figSectors(){
  const a=270, e=.75, b=a*Math.sqrt(1-e*e), c=a*e, cx=350, cy=195, sx=cx+c, dM=.55;
  const Ek = M => { let E = M; for (let i=0;i<40;i++) E -= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); return E; };
  const P = M => { const E = Ek(M); return [sx+a*(Math.cos(E)-e), cy-b*Math.sin(E)]; };
  const sec = (M0,cls) => { let d = 'M'+N1(sx)+','+cy; for (let i=0;i<=30;i++){ const q = P(M0-dM/2+dM*i/30); d += ' L'+N1(q[0])+','+N1(q[1]); } return '<path class="'+cls+'" d="'+d+' Z"/>'; };
  const pp = P(0), pa = P(Math.PI);
  let s = '<ellipse class="fl" cx="'+cx+'" cy="'+cy+'" rx="'+a+'" ry="'+N1(b)+'"/>'+sec(0,'fz1')+sec(Math.PI,'fz2');
  s += T_(sx+36,cy-24,'A₁','fx','middle')+T_(cx-30,cy+4,'A₂','fx','middle');
  s += D_(sx,cy,9,'fs')+T_(sx,cy+30,'Ήλιος','ft','middle');
  s += AR_(pp[0],pp[1],pp[0],pp[1]-76,'fa')+D_(pp[0],pp[1],6,'fp')+T_(pp[0]+12,pp[1]-52,'vπ','fx');
  s += AR_(pa[0],pa[1],pa[0],pa[1]+11,'fa')+D_(pa[0],pa[1],6,'fp')+T_(pa[0]+14,pa[1]+28,'vα','fx');
  return FIG_('700 390', s, 'Τα δύο σκιασμένα τμήματα διαγράφονται σε ίσους χρόνους, άρα έχουν ίσο εμβαδόν (A₁ = A₂). Κοντά στον Ήλιο το τμήμα είναι πλατύ και κοντό, μακριά του στενό και μακρύ. Τα βέλη δείχνουν την ταχύτητα, με το μήκος τους σε κλίμακα.');
}
function figLog(){
  const X0=72, X1=610, Y0=290, Y1=26, a0=.3, a1=12, t0=.2, t1=35, lg = Math.log10;
  const mx = a => X0+(lg(a)-lg(a0))/(lg(a1)-lg(a0))*(X1-X0), my = t => Y0-(lg(t)-lg(t0))/(lg(t1)-lg(t0))*(Y0-Y1);
  const fm = v => String(v).replace('.',',');
  let s = '';
  [.5,1,2,5,10].forEach(v => { s += L_(mx(v),Y0,mx(v),Y1,'fg')+T_(mx(v),Y0+18,fm(v),'ft','middle'); });
  [.3,1,3,10,30].forEach(v => { s += L_(X0,my(v),X1,my(v),'fg')+T_(X0-9,my(v)+4,fm(v),'ft','end'); });
  s += L_(X0,Y0,X1,Y0,'fl')+L_(X0,Y0,X0,Y1,'fl');
  s += L_(mx(Math.pow(t0,2/3)),my(t0),mx(Math.pow(t1,2/3)),my(t1),'fa fdash');
  KEPL_TBL.forEach(r => { s += D_(mx(r[1]),my(r[2]),5.5,'fp')+T_(mx(r[1])+10,my(r[2])+(r[1]<.5?-9:17),r[0],'ft'); });
  s += T_(X1,Y0+38,'a (AU)','fx','end')+T_(X0+8,Y1+4,'T (έτη)','fx')+T_(mx(.42),my(9),'T = a^1,5 → ευθεία με κλίση 3/2','ft');
  return FIG_('660 335', s, 'Οι έξι πλανήτες σε λογαριθμικούς άξονες πέφτουν πάνω στην ίδια ευθεία. Αυτό σημαίνει T ∝ a^(3/2), δηλαδή T² ∝ a³.');
}
function figMars(){
  const a=140, e=.093, b=a*Math.sqrt(1-e*e), cx=200, cy=150, sx=cx+a*e;
  let s = D_(cx,cy,a,'fd')+'<ellipse class="fl" cx="'+cx+'" cy="'+cy+'" rx="'+a+'" ry="'+N1(b)+'"/>';
  s += D_(cx,cy,3,'fp')+T_(cx-8,cy-12,'κέντρο','ft','end')+D_(sx,cy,6,'fs')+T_(sx+10,cy+20,'Ήλιος','ft');
  s += L_(380,100,412,100,'fl')+T_(422,104,'έλλειψη Άρη, e = 0,093','fx');
  s += L_(380,128,412,128,'fd')+T_(422,132,'κύκλος ίδιου ημιάξονα','fx');
  s += T_(380,172,'b = 0,9957·a','ft')+T_(380,194,'Ο Ήλιος απέχει 0,093·a από το κέντρο.','ft');
  return FIG_('700 300', s, 'Η τροχιά του Άρη σε κλίμακα. Η έλλειψη διαφέρει από τον κύκλο λιγότερο από 0,5%, ενώ η θέση του Ήλιου ως προς το κέντρο φαίνεται καθαρά.');
}

const R_ = (x,y,w,h,cls,rx) => '<rect x="'+N1(x)+'" y="'+N1(y)+'" width="'+N1(w)+'" height="'+N1(h)+'" class="'+cls+'"'+(rx?' rx="'+rx+'"':'')+'/>';
const PG_ = (pts,cls) => '<polygon points="'+pts.map(p=>N1(p[0])+','+N1(p[1])).join(' ')+'" class="'+cls+'"/>';
const PL_ = (pts,cls) => '<polyline points="'+pts.map(p=>N1(p[0])+','+N1(p[1])).join(' ')+'" class="'+cls+'"/>';
const AH_ = (x1,y1,x2,y2,lc,hc,s) => { s = s||8; const g = Math.atan2(y2-y1,x2-x1), p = d => N1(x2-s*Math.cos(g+d))+','+N1(y2-s*Math.sin(g+d));
  return L_(x1,y1,x2,y2,lc)+'<polygon class="'+hc+'" points="'+N1(x2)+','+N1(y2)+' '+p(-.4)+' '+p(.4)+'"/>'; };
const fmtN = x => { if (!isFinite(x)) return '–'; if (x===0) return '0'; const ax = Math.abs(x);
  if (ax>=1e6 || ax<1e-3) return x.toExponential(2).replace('.',',').replace('e+','×10^').replace('e-','×10^-');
  return String(Number(x.toPrecision(4))).replace('.',','); };
const CALC_REG = {};
function CALC(sid, ins, fn, outLbl, unit){
  const L = CALC_REG[sid] || (CALC_REG[sid] = []);
  const k = sid+'_'+L.length; L.push({k, fn});
  return '<div class="an-calc" id="cc_'+k+'">'+ins.map(x => '<span>'+x[0]+'</span><input type="text" inputmode="decimal" value="'+x[1]+'" aria-label="'+x[0]+'">'+(x[2]?'<span>'+x[2]+'</span>':'')).join('')+
    '<span>→ '+outLbl+' <b></b> '+(unit||'')+'</span></div>';
}
function bindCalcs(sid){
  (CALC_REG[sid]||[]).forEach(c => {
    const box = document.getElementById('cc_'+c.k); if (!box) return;
    const ins = [...box.querySelectorAll('input')], o = box.querySelector('b');
    const upd = () => { const v = ins.map(i => parseFloat(i.value.replace(',','.'))); o.textContent = v.every(isFinite) ? fmtN(c.fn(v)) : '–'; };
    ins.forEach(i => i.oninput = upd); upd();
  });
}
function LEAD(pts, names, lx, y0, dy){
  return pts.map((p,i) => { const ly = y0-dy*i; return L_(p[0],p[1],lx-8,ly-4,'fd')+D_(p[0],p[1],3,'fp')+T_(lx,ly,names[i],'fx'); }).join('');
}

 {h:'Η αρχή του Αρχιμήδη (άνωση)', html:`<p>Ένα σώμα μέσα σε ρευστό δέχεται άνωση ίση με το βάρος του ρευστού που εκτοπίζει. Η αρχή εξηγεί γιατί επιπλέουν τα πλοία και γιατί ένα σώμα φαίνεται ελαφρύτερο στο νερό. Η διήγηση για το χρυσό στέμμα του Ιέρωνα και την ιστορία του «εύρηκα» προέρχεται από τον Βιτρούβιο και ιστορικά είναι αβέβαιη.</p>${figBuoy()}
  <div class="fm">B = ρ<sub>υγρού</sub>·V<sub>βυθ</sub>·g<small>V<sub>βυθ</sub>: όγκος του βυθισμένου μέρους, g ≈ 9,81 m/s²</small></div>
  ${CALC('archimedes',[['ρ',1000,'kg/m³'],['V',2,'L']], v => v[0]*(v[1]/1000)*9.81, 'B =','N')}`},
 {h:'Κέντρο βάρους', html:`<p>Το κέντρο βάρους είναι το σημείο όπου μπορούμε να θεωρήσουμε συγκεντρωμένο το βάρος ενός σώματος. Ένα σώμα ισορροπεί αν στηριχθεί σε αυτό το σημείο. Ο Αρχιμήδης το προσδιόρισε για επίπεδα σχήματα με γεωμετρικές αποδείξεις.</p>${figCentroid()}`},
 {h:'Γιατί έχει σημασία', html:`<p>Ο Αρχιμήδης έδειξε ότι η μηχανική μπορεί να έχει τη μορφή μαθηματικής θεωρίας. Η «μέθοδος της εξάντλησης», που χρησιμοποίησε για εμβαδά και όγκους, προανήγγειλε τον ολοκληρωτικό λογισμό. Οι αρχές της υδροστατικής και της στατικής χρησιμοποιούνται αυτούσιες ακόμα και σήμερα.</p>`}
];

/* ---------- Ερατοσθένης ---------- */
function figEra(){
  const cx=230, cy=200, R=150, th=30*Math.PI/180;
  const sy=[cx+R,cy], al=[cx+R*Math.cos(th),cy-R*Math.sin(th)], n=[Math.cos(th),-Math.sin(th)], t=[Math.sin(th),Math.cos(th)];
  const Ls=70, T=[al[0]+Ls*n[0],al[1]+Ls*n[1]], st=-Ls*Math.tan(th), tip=[al[0]+st*t[0],al[1]+st*t[1]];
  let s = D_(cx,cy,R,'fl')+D_(cx,cy,3,'fp');
  s += L_(690,cy,sy[0],cy,'fa')+L_(sy[0],cy,cx,cy,'fd')+L_(cx,cy,al[0],al[1],'fd');
  s += L_(690,T[1],tip[0],tip[1],'fa')+L_(al[0],al[1],T[0],T[1],'fk')+L_(tip[0],tip[1],al[0],al[1],'fa')+L_(tip[0]-10,tip[1]-10*Math.tan(th),al[0]+22*t[0],al[1]+22*t[1],'fd');
  s += '<path class="fb" d="M'+N1(sy[0])+','+cy+' A'+R+' '+R+' 0 0 0 '+N1(al[0])+','+N1(al[1])+'"/>';
  s += '<path class="fd" d="M'+N1(cx+60)+','+cy+' A60 60 0 0 0 '+N1(cx+60*Math.cos(th))+','+N1(cy-60*Math.sin(th))+'"/>'+T_(cx+84*Math.cos(th/2),cy-84*Math.sin(th/2)+4,'θ','fx','middle');
  s += '<path class="fd" d="M'+N1(T[0]-30)+','+N1(T[1])+' A30 30 0 0 0 '+N1(T[0]-30*Math.cos(th))+','+N1(T[1]+30*Math.sin(th))+'"/>'+T_(T[0]-48,T[1]+18,'θ','fx','middle');
  s += T_(sy[0]+8,cy+24,'Συήνη','fx')+T_(al[0]-26,al[1]-30,'Αλεξάνδρεια','fx','end')+T_(cx+(R+14)*Math.cos(th/2)+2,cy-(R+14)*Math.sin(th/2),'d','fx');
  s += T_(470,60,'ακτίνες του Ήλιου (παράλληλες)','ft')+T_(cx,cy+24,'κέντρο Γης','ft','middle');
  return FIG_('700 380', s, 'Σχηματικά, με υπερβολικά μεγάλη γωνία. Στη Συήνη ο Ήλιος είναι στο ζενίθ (η ακτίνα φωτίζει τον πυθμένα πηγαδιού), ενώ στην Αλεξάνδρεια ο γνώμονας σχηματίζει σκιά. Η γωνία θ του γνώμονα ισούται με τη γωνία θ στο κέντρο της Γης.');
}
function figTilt(){
  const cx=350, cy=150, R=90, e=23.44*Math.PI/180;
  const ax=[Math.sin(e),-Math.cos(e)], eq=[Math.cos(e),Math.sin(e)];
  let s = D_(cx,cy,R,'fl');
  s += L_(cx-170,cy,cx+170,cy,'fd')+L_(cx,cy-130,cx,cy+130,'fd');
  s += L_(cx-ax[0]*125,cy-ax[1]*125,cx+ax[0]*125,cy+ax[1]*125,'fk')+L_(cx-eq[0]*R,cy-eq[1]*R,cx+eq[0]*R,cy+eq[1]*R,'fb');
  s += '<path class="fa" d="M'+cx+','+(cy-70)+' A70 70 0 0 1 '+N1(cx+70*Math.sin(e))+','+N1(cy-70*Math.cos(e))+'"/>'+T_(cx-18,cy-76,'ε','fx');
  s += T_(cx+ax[0]*125+8,cy+ax[1]*125+4,'άξονας','ft')+T_(cx+eq[0]*R+8,cy+eq[1]*R+4,'ισημερινός','ft')+T_(cx+175,cy+4,'επίπεδο τροχιάς','ft')+T_(cx+6,cy-134,'κάθετη στην τροχιά','ft');
  return FIG_('700 300', s, 'Η κλίση του άξονα ε ισούται με τη γωνία μεταξύ του ισημερινού και του επιπέδου της τροχιάς. Σήμερα είναι 23,4°.');
}
AN.eratosthenes = [
 {h:'Το πλαίσιο', html:`<p>Ο Ερατοσθένης (περ. 276–194 π.Χ.) διηύθυνε τη Βιβλιοθήκη της Αλεξάνδρειας. Η ιδέα ότι η Γη είναι σφαίρα ήταν ήδη γνωστή στους μορφωμένους Έλληνες. Εκείνος ήταν ο πρώτος που υπολόγισε το μέγεθός της με μέτρηση.</p><p>Ήξερε ότι στη Συήνη (σημερινό Ασουάν) το μεσημέρι του θερινού ηλιοστασίου ο Ήλιος φωτίζει τον πυθμένα ενός πηγαδιού, δηλαδή βρίσκεται στο ζενίθ. Την ίδια ώρα στην Αλεξάνδρεια ένας κατακόρυφος γνώμονας έριχνε σκιά.</p>`},
 {h:'Μέτρηση της Γης', html:`<p>Επειδή ο Ήλιος είναι πολύ μακριά, οι ακτίνες του φτάνουν παράλληλες. Η γωνία της σκιάς στην Αλεξάνδρεια είναι τότε ίση με τη γωνία που σχηματίζουν στο κέντρο της Γης οι ευθείες προς τις δύο πόλεις, και αυτή είναι το ίδιο κλάσμα του πλήρους κύκλου που είναι η απόσταση d της περιφέρειας της Γης.</p>${figEra()}
  <div class="fm">C = (360° / θ) · d<small>θ: γωνία γνώμονα, d: απόσταση Συήνης–Αλεξάνδρειας, C: περιφέρεια της Γης</small></div>
  <ul><li>Ο Ερατοσθένης βρήκε θ ≈ 7,2°, δηλαδή το 1/50 του κύκλου, και d = 5000 στάδια. Άρα C = 250.000 στάδια (αργότερα 252.000).</li><li>Το μήκος του σταδίου δεν είναι βέβαιο: με 157,5 m προκύπτουν περίπου 39.400 km και με 185 m περίπου 46.000 km. Η πραγματική περιφέρεια είναι περίπου 40.075 km.</li></ul>
  ${CALC('eratosthenes',[['θ',7.2,'°'],['d',5000,'στάδια']], v => 360/v[0]*v[1]*0.1575, 'C =','km (στάδιο 157,5 m)')}`},
 {h:'Η κλίση του άξονα της Γης', html:`<p>Ο Ερατοσθένης μέτρησε και τη γωνιακή διαφορά του ύψους του Ήλιου ανάμεσα στο θερινό και στο χειμερινό ηλιοστάσιο. Βρήκε 11/83 του κύκλου, δηλαδή περίπου 47°42′. Η μισή τιμή, περίπου 23°51′, είναι η κλίση του άξονα της Γης ως προς την κάθετη στο επίπεδο της τροχιάς.</p>${figTilt()}
  <ul><li>Η σύγχρονη τιμή είναι περίπου 23,4°, επομένως το αποτέλεσμα απέχει λιγότερο από μισή μοίρα.</li><li>Η κλίση αυτή προκαλεί τις εποχές και ορίζει τη θέση των τροπικών.</li></ul>`},
 {h:'Σφάλματα και σημασία', html:`<p>Η Συήνη δεν βρίσκεται ακριβώς στον ίδιο μεσημβρινό με την Αλεξάνδρεια (διαφέρουν περίπου 3° σε μήκος) και η απόσταση προήλθε από εκτιμήσεις των καραβανιών, οπότε το αποτέλεσμα είναι προσεγγιστικό. Η μέθοδος όμως είναι ορθή: συνδυάζει μία μέτρηση γωνίας με απλή γεωμετρία, και είναι από τα πρώτα παραδείγματα επιστημονικής μέτρησης ενός μεγέθους που δεν μπορεί να μετρηθεί άμεσα.</p>`},
 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Οι αρχαίοι πίστευαν ότι η Γη είναι επίπεδη».</b> Οι μορφωμένοι Έλληνες γνώριζαν τη σφαιρικότητά της από τον Αριστοτέλη και πριν. Το νέο στον Ερατοσθένη ήταν η μέτρηση του μεγέθους.</li><li><b>«Μέτρησε με ακρίβεια τη Γη».</b> Το αποτέλεσμα εξαρτάται από το μήκος του σταδίου που χρησιμοποίησε, και αυτό δεν είναι βέβαιο.</li></ul>`}
];

/* ---------- Ιμπν αλ-Χαϊθάμ ---------- */
function figEye(){
  const eye = (x,y) => D_(x,y,16,'fo')+D_(x+5,y,5,'fp');
  let s = T_(180,24,'Θεωρία εκπομπής (Ευκλείδης, Πτολεμαίος)','ft','middle')+T_(520,24,'Ιμπν αλ-Χαϊθάμ: το φως έρχεται στο μάτι','fx','middle');
  s += R_(280,80,10,100,'fo')+L_(40,130,280,92,'fd')+L_(40,130,280,130,'fd')+L_(40,130,280,168,'fd')+eye(40,130);
  s += AH_(100,121,150,113,'fd','fh',6)+AH_(100,130,150,130,'fd','fh',6)+AH_(100,139,150,147,'fd','fh',6);
  s += R_(400,80,10,100,'fo')+eye(660,130);
  [92,130,168].forEach(y => { s += L_(410,y,644,130,'fa'); });
  s += AH_(520,130,560,130,'fa','fh',7)+T_(170,210,'το μάτι «στέλνει» ακτίνες','ft','middle')+T_(540,210,'το αντικείμενο στέλνει φως','ft','middle');
  return FIG_('700 230', s, 'Οι αρχαίες θεωρίες δέχονταν ακτίνες που εκπέμπει το μάτι. Ο Ιμπν αλ-Χαϊθάμ έδειξε ότι το φως προέρχεται από τα αντικείμενα και μπαίνει στο μάτι, και ότι κάθε σημείο τους ακτινοβολεί προς όλες τις κατευθύνσεις.');
}
function figCam(){
  let s = L_(100,190,100,90,'fk')+D_(100,90,3,'fp')+T_(100,214,'αντικείμενο (h)','ft','middle');
  s += L_(300,30,300,144,'fk')+L_(300,156,300,240,'fk')+T_(300,262,'οπή','ft','middle');
  s += L_(560,98,560,228,'fb')+D_(560,228,3,'fp')+T_(560,262,'οθόνη','ft','middle');
  s += L_(100,90,560,228,'fa')+L_(100,190,560,98,'fa');
  s += T_(572,170,'h′','fx')+T_(86,150,'h','fx','end');
  s += L_(100,282,300,282,'fa')+T_(200,300,'d','fx','middle')+L_(300,288,560,288,'fb')+T_(430,306,'d′','fx','middle');
  return FIG_('700 316', s, 'Σκοτεινός θάλαμος: οι ακτίνες διέρχονται από μικρή οπή και σχηματίζουν αντεστραμμένη εικόνα, επειδή το φως ταξιδεύει σε ευθεία γραμμή.');
}
function figRefr(){
  const cx=350, cy=150, n=1.33, a1=50*Math.PI/180, a2=Math.asin(Math.sin(a1)/n), L=140;
  let s = R_(80,150,540,130,'fz1')+L_(80,150,620,150,'fl')+L_(cx,20,cx,280,'fd');
  s += AH_(cx-L*Math.sin(a1),cy-L*Math.cos(a1),cx,cy,'fa','fh')+AH_(cx,cy,cx+L*Math.sin(a1),cy-L*Math.cos(a1),'fa','fh')+AH_(cx,cy,cx+L*Math.sin(a2),cy+L*Math.cos(a2),'fb','fhb');
  s += '<path class="fd" d="M'+N1(cx-50*Math.sin(a1))+','+N1(cy-50*Math.cos(a1))+' A50 50 0 0 0 '+cx+','+(cy-50)+'"/>'+T_(cx-32,cy-56,'θ₁','fx','middle');
  s += '<path class="fd" d="M'+cx+','+(cy+60)+' A60 60 0 0 0 '+N1(cx+60*Math.sin(a2))+','+N1(cy+60*Math.cos(a2))+'"/>'+T_(cx+30,cy+90,'θ₂','fx','middle');
  s += T_(100,40,'αέρας','ft')+T_(100,270,'νερό','ft')+T_(cx+60,cy-96,'ανάκλαση','ft');
  return FIG_('700 290', s, 'Ανάκλαση (θ₁ = θ₁′) και διάθλαση στη διαχωριστική επιφάνεια αέρα–νερού. Ο Ιμπν αλ-Χαϊθάμ μέτρησε πειραματικά γωνίες διάθλασης αλλά δεν διατύπωσε τον νόμο: n₁·ημθ₁ = n₂·ημθ₂.');
}
AN.alhazen = [

/* ---------- Κοπέρνικος ---------- */
function figHelio(){
  const cx=240, cy=200, k=36, a=[0,.387,.723,1,1.524,5.203,9.537], nm=['Ήλιος','Ερμής','Αφροδίτη','Γη','Άρης','Δίας','Κρόνος'];
  let s = '';
  for (let i=6;i>=1;i--) s += D_(cx,cy,k*Math.sqrt(a[i]),'fl');
  s += D_(cx,cy,9,'fs');
  s += LEAD(a.map(v => [cx+k*Math.sqrt(v),cy]), nm, 500, 360, 50);
  s += T_(30,380,'σχηματικό: οι ακτίνες είναι ανάλογες με την τετραγωνική ρίζα της απόστασης','ft');
  return FIG_('700 392', s, 'Ο Ήλιος στο κέντρο και οι πλανήτες σε τροχιές γύρω του. Η Γη είναι ένας από τους πλανήτες και η Σελήνη περιφέρεται γύρω από τη Γη.');
}
function marsGeom(t){ const pe = 2*Math.PI*t, pm = 2*Math.PI*t/1.881; return {E:[Math.cos(pe),Math.sin(pe)], M:[1.524*Math.cos(pm),1.524*Math.sin(pm)]}; }
function figRetro(){
  const cx=200, cy=160, u=58;
  let s = D_(cx,cy,u,'fl')+D_(cx,cy,1.524*u,'fl')+D_(cx,cy,6,'fs');
  for (let i=0;i<7;i++){
    const g = marsGeom((i-3)/12), E=[cx+u*g.E[0],cy-u*g.E[1]], M=[cx+u*g.M[0],cy-u*g.M[1]];
    const dx=M[0]-E[0], dy=M[1]-E[1], len=Math.hypot(dx,dy), d=[dx/len,dy/len], ex=[E[0]+d[0]*330,E[1]+d[1]*330];
    const rl=Math.hypot(E[0]-cx,E[1]-cy);
    s += L_(E[0],E[1],ex[0],ex[1],'fg')+D_(E[0],E[1],4,'fp')+D_(M[0],M[1],4,'fmb')+T_(cx+(E[0]-cx)/rl*(rl+14),cy+(E[1]-cy)/rl*(rl+14)+4,i+1,'ft','middle');
  }
  s += D_(440,22,4,'fp')+T_(452,26,'Γη (1 έως 7, ανά 30 ημέρες)','fx')+D_(440,44,4,'fmb')+T_(452,48,'Άρης','fx')+L_(434,64,446,64,'fg')+T_(452,68,'ευθεία παρατήρησης Γης → Άρη','fx');
  return FIG_('700 290', s, 'Οι ευθείες από τη Γη προς τον Άρη δείχνουν σε ποιο σημείο του ουρανού τον βλέπουμε. Καθώς η Γη προσπερνά τον Άρη, οι ευθείες 3, 4, 5 στρέφονται προς την αντίθετη κατεύθυνση: ο Άρης φαίνεται να γυρίζει πίσω. Απλοποιημένο μοντέλο με κυκλικές, ομοεπίπεδες τροχιές.');
}
function figRetroChart(){
  const N=240, pts=[]; let prev=null, off=0;
  for (let i=0;i<=N;i++){ const t=-.5+i/N, g=marsGeom(t); let l=Math.atan2(g.M[1]-g.E[1],g.M[0]-g.E[0]);
    if (prev!==null){ while (l+off-prev>Math.PI) off-=2*Math.PI; while (l+off-prev<-Math.PI) off+=2*Math.PI; }
    const v=l+off; prev=v; pts.push([t,v*180/Math.PI]); }
  const ys=pts.map(p=>p[1]), lo=Math.floor(Math.min(...ys)/10)*10, hi=Math.ceil(Math.max(...ys)/10)*10;
  const X0=80,X1=640,Y0=250,Y1=26, mx=t=>X0+(t+.5)*(X1-X0), my=v=>Y0-(v-lo)/(hi-lo)*(Y0-Y1);
  const st=[]; for (let i=1;i<N;i++){ if ((pts[i][1]-pts[i-1][1])*(pts[i+1][1]-pts[i][1])<0) st.push(pts[i][0]); }
  let s = '';
  if (st.length>=2) s += R_(mx(st[0]),Y1,mx(st[st.length-1])-mx(st[0]),Y0-Y1,'fz2');
  [-.5,-.25,0,.25,.5].forEach(t => { s += L_(mx(t),Y0,mx(t),Y1,'fg')+T_(mx(t),Y0+18,Math.round(t*365.25),'ft','middle'); });
  for (let v=Math.ceil(lo/50)*50; v<=hi; v+=50) s += L_(X0,my(v),X1,my(v),'fg')+T_(X0-8,my(v)+4,v,'ft','end');
  s += L_(X0,Y0,X1,Y0,'fl')+L_(X0,Y0,X0,Y1,'fl')+PL_(pts.map(p=>[mx(p[0]),my(p[1])]),'fa');
  s += T_(X1,Y0+38,'ημέρες από την αντίθεση','fx','end')+T_(X0+8,Y1+6,'φαινόμενη θέση (°)','fx');
  if (st.length>=2) s += T_((mx(st[0])+mx(st[st.length-1]))/2,Y1+16,'ανάδρομη','ft','middle');
  return FIG_('700 300', s, 'Η φαινόμενη θέση του Άρη στον ουρανό. Στο σκιασμένο διάστημα (περίπου ±36 ημέρες από την αντίθεση) κινείται προς τα πίσω, ενώ το υπόλοιπο διάστημα κινείται προς τα εμπρός.');
}
function figPar(){

  let s = D_(cx,cy,R,'fl')+D_(cx,cy,6,'fs')+L_(40,yb,660,yb,'fd')+D_(star[0],star[1],5,'fp');
  [p1,p2].forEach(p => { s += L_(p[0],p[1],proj(p[0]),yb,'fa')+D_(p[0],p[1],5,'fo')+D_(proj(p[0]),yb,4,'fb'); });
  s += T_(cx,cy+34,'Ήλιος','ft','middle')+T_(p1[0]-10,p1[1]+20,'Ιανουάριος','ft','end')+T_(p2[0]+10,p2[1]+20,'Ιούλιος','ft')+T_(star[0]+12,star[1]+4,'κοντινό αστέρι','ft');
  s += T_(40,14,'μακρινά αστέρια','ft')+T_(proj(p1[0]),yb+20,'','ft');
  return FIG_('700 280', s, 'Αν η Γη κινείται γύρω από τον Ήλιο, ένα κοντινό αστέρι πρέπει να φαίνεται να μετατοπίζεται σε σχέση με τα μακρινά. Η παράλλαξη είναι τόσο μικρή που μετρήθηκε μόλις το 1838 (Μπέσελ, 61 Κύκνου, περίπου 0,3 δευτερόλεπτα τόξου).');
}
AN.copernicus = [
 {h:'Το πλαίσιο', html:`<p>Το έργο «Περί των περιστροφών των ουρανίων σφαιρών» εκδόθηκε το 1543, στο έτος του θανάτου του Κοπέρνικου. Μέχρι τότε κυριαρχούσε το γεωκεντρικό σύστημα του Πτολεμαίου, με ομαλές κυκλικές κινήσεις, επικύκλους και εκκέντρους, που περιέγραφε ικανοποιητικά τις θέσεις των πλανητών αλλά ήταν περίπλοκο.</p>`},

/* ---------- Γαλιλαίος ---------- */
function figPend(){
  const px=190, py=36, L=190, th=25*Math.PI/180, bx=px-L*Math.sin(th), by=py+L*Math.cos(th);
  let s = L_(px,py,px,py+L+30,'fd')+L_(px-60,py,px+60,py,'fl')+D_(px,py,3,'fp');
  s += '<path class="fd" d="M'+N1(px-L*Math.sin(th))+','+N1(py+L*Math.cos(th))+' A'+L+' '+L+' 0 0 0 '+N1(px+L*Math.sin(th))+','+N1(py+L*Math.cos(th))+'"/>';
  s += D_(px+L*Math.sin(th),by,12,'fo')+L_(px,py,bx,by,'fk')+D_(bx,by,12,'fs');
  s += '<path class="fd" d="M'+px+','+(py+60)+' A60 60 0 0 1 '+N1(px-60*Math.sin(th))+','+N1(py+60*Math.cos(th))+'"/>'+T_(px-24,py+88,'θ','fx','middle')+T_((px+bx)/2-14,(py+by)/2,'L','fx','end')+T_(bx-18,by+4,'m','fx','end');
  const X0=400, X1=660, Y0=260, Y1=36, Lmax=2.5, Tmax=3.5, mx=l=>X0+l/Lmax*(X1-X0), my=t=>Y0-t/Tmax*(Y0-Y1);
  [0,1,2].forEach(l => { s += L_(mx(l),Y0,mx(l),Y1,'fg')+T_(mx(l),Y0+18,l,'ft','middle'); });
  [1,2,3].forEach(t => { s += L_(X0,my(t),X1,my(t),'fg')+T_(X0-8,my(t)+4,t,'ft','end'); });
  s += L_(X0,Y0,X1,Y0,'fl')+L_(X0,Y0,X0,Y1,'fl');
  const pts=[]; for (let i=0;i<=50;i++){ const l=Lmax*i/50; pts.push([mx(l),my(2*Math.PI*Math.sqrt(l/9.81))]); }
  s += PL_(pts,'fa')+T_(X1,Y0+36,'L (m)','fx','end')+T_(X0+8,Y1-6,'T (s)','fx')+T_(X0+60,Y1+20,'T = 2π√(L/g)','ft');
  return FIG_('700 300', s, 'Αριστερά: το εκκρεμές. Η περίοδος δεν εξαρτάται από τη μάζα ούτε (για μικρές γωνίες) από το πλάτος. Δεξιά: εξαρτάται μόνο από το μήκος, T ∝ √L.');
}
function figIncl(){
  const P0=[60,70], P1=[620,245], dx=P1[0]-P0[0], dy=P1[1]-P0[1], len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=uy, ny=-ux;
  const at = f => [P0[0]+dx*f, P0[1]+dy*f];
  let s = L_(P0[0],P0[1],P1[0],P1[1],'fl');
  for (let n=0;n<=4;n++){ const p=at(n*n/16); s += D_(p[0]+nx*9,p[1]+ny*9,8,n?'fo':'fs')+T_(p[0]+nx*28,p[1]+ny*28+4,n,'ft','middle'); }
  const odd=[1,3,5,7];
  for (let n=1;n<=4;n++){ const a=at((n-1)*(n-1)/16), b=at(n*n/16), m=[(a[0]+b[0])/2-nx*20,(a[1]+b[1])/2-ny*20];
    s += L_(a[0]-nx*12,a[1]-ny*12,b[0]-nx*12,b[1]-ny*12,n%2?'fa':'fb')+T_(m[0],m[1]+4,odd[n-1],'fx','middle'); }
  s += T_(60,30,'διαδοχικές χρονικές στιγμές 0, 1, 2, 3, 4','ft');
  return FIG_('700 290', s, 'Σε ίσα χρονικά διαστήματα το σώμα διανύει αποστάσεις με λόγο 1 : 3 : 5 : 7, άρα οι συνολικές αποστάσεις είναι 1, 4, 9, 16 (s ∝ t²).');
}
function figJup(){
  const cx=350, sc=9, mo=[['Ιώ',5.9,1.769,.6,'fs'],['Ευρώπη',9.4,3.551,2,'fmb'],['Γανυμήδης',15,7.155,4,'fm3'],['Καλλιστώ',26.4,16.689,5.3,'fp']];
  let s = '';
  mo.forEach((m,i) => { s += D_(60+i*130,16,4,m[4])+T_(70+i*130,20,m[0],'ft'); });
  for (let n=0;n<7;n++){ const y=52+n*34;
    s += T_(20,y+4,'Νύχτα '+(n+1),'ft')+D_(cx,y,9,'fo');
    mo.forEach(m => { s += D_(cx+m[1]*sc*Math.sin(2*Math.PI*n/m[2]+m[3]),y,3.5,m[4]); }); }
  return FIG_('700 300', s, 'Σχηματική αναπαράσταση των τεσσάρων μεγάλων δορυφόρων του Δία, με πραγματικές περιόδους και αυθαίρετη αρχική φάση. Ο Γαλιλαίος κατέγραψε το 1610 ότι τα τέσσερα «αστέρια» αλλάζουν θέση από νύχτα σε νύχτα και ακολουθούν τον Δία, άρα τον περιφέρονται.');
}
AN.galileo = [

/* ---------- Νεύτων ---------- */
function figForces(){

  s += L_(30,170,350,170,'fl')+R_(110,110,80,60,'fo',4)+T_(150,146,'m','fx','middle');
  s += AH_(190,140,290,140,'fa','fh')+T_(262,126,'F₁','fx')+AH_(110,140,70,140,'fb','fhb')+T_(76,126,'F₂','fx');
  s += AH_(150,205,210,205,'fa','fh')+T_(140,209,'ΣF','fx','end')+AH_(150,245,210,245,'fb','fhb')+T_(140,249,'a','fx','end');
  s += L_(370,170,670,170,'fl')+R_(430,110,80,60,'fo',4)+T_(470,164,'Α','fx','middle')+R_(510,110,80,60,'fo',4)+T_(550,164,'Β','fx','middle');
  s += AH_(562,140,630,140,'fa','fh')+T_(618,126,'F₁','fx')+AH_(458,140,400,140,'fb','fhb')+T_(406,126,'F₂','fx');
  s += T_(520,205,'F₁: δύναμη του Α στο Β','ft','middle')+T_(520,225,'F₂: δύναμη του Β στο Α','ft','middle')+T_(520,250,'ίσες και αντίθετες, σε διαφορετικά σώματα','ft','middle');
  return FIG_('700 270', s, 'Αριστερά: η συνισταμένη δύναμη προκαλεί επιτάχυνση προς την ίδια κατεύθυνση. Δεξιά: οι δυνάμεις δράσης–αντίδρασης δρουν σε διαφορετικά σώματα, γι’ αυτό δεν αλληλοαναιρούνται.');
}
function figCannon(){
  const cx=350, cy=200, R=95, r0=1.06, vc=Math.sqrt(1/r0);
  const sim = (v,T) => { let x=0,y=r0,vx=v,vy=0; const dt=.004, pts=[[x,y]]; const acc=(x,y)=>{ const r3=Math.pow(x*x+y*y,1.5); return [-x/r3,-y/r3]; };
    for (let t=0;t<T;t+=dt){ let a=acc(x,y); vx+=a[0]*dt/2; vy+=a[1]*dt/2; x+=vx*dt; y+=vy*dt; a=acc(x,y); vx+=a[0]*dt/2; vy+=a[1]*dt/2;
      if (Math.hypot(x,y)<1 && t>.05) break; pts.push([x,y]); } return pts; };
  const toS = pts => pts.filter((p,i)=>i%6===0).map(p => [cx+R*p[0],cy-R*p[1]]);
  let s = '';
  const defs = [[.6,'fd',3],[.9,'fb',3],[1,'fa',2*Math.PI*Math.pow(r0,1.5)],[1.15,'f3',2*Math.PI*Math.pow(1/(2/r0-1.15*1.15*vc*vc),1.5)]];
  defs.forEach(d => { s += PL_(toS(sim(vc*d[0],d[2]+.05)),d[1]); });
  s += D_(cx,cy,R,'fo')+T_(cx,cy+4,'Γη','fx','middle');
  s += PG_([[cx-8,cy-R+1],[cx+8,cy-R+1],[cx,cy-R*r0]],'fl')+D_(cx,cy-R*r0,3,'fp');
  const lg = [['πέφτει κοντά','fd'],['πέφτει μακρύτερα','fb'],['κυκλική τροχιά','fa'],['ελλειπτική τροχιά','f3']];
  s += T_(20,36,'v σε σχέση με v_κ','ft');
  lg.forEach((l,i) => { s += L_(20,60+i*26,50,60+i*26,l[1])+T_(58,64+i*26,l[0],'ft'); });
  return FIG_('700 430', s, 'Το «πείραμα σκέψης» του Νεύτωνα: ένα βλήμα εκτοξεύεται οριζόντια από βουνό. Όσο μεγαλύτερη η ταχύτητα, τόσο πιο μακριά πέφτει, ώσπου να μη φτάνει ποτέ στη Γη και να περιφέρεται γύρω της. Σχηματικό (το βουνό είναι υπερβολικά ψηλό).');
}
function figPrism(){
  const cols=['#e74c3c','#f39c12','#f1c40f','#2ecc71','#3498db','#4b5bd6','#9b59b6'], ys=[214,226,238,250,262,272,282];
  let s = PG_([[260,230],[380,230],[320,126]],'fl');
  s += L_(40,180,289,180,'fk')+L_(289,180,363,200,'fd');
  ys.forEach((y,i) => { s += '<line x1="363" y1="200" x2="640" y2="'+y+'" style="stroke:'+cols[i]+';stroke-width:2.2;opacity:.9"/>'; });
  s += L_(640,190,640,310,'fl')+T_(120,165,'λευκό φως','ft','middle')+T_(320,252,'πρίσμα','ft','middle')+T_(600,180,'φάσμα','ft','middle');
  return FIG_('700 320', s, 'Το λευκό φως αναλύεται σε χρώματα, γιατί κάθε χρώμα διαθλάται κάπως διαφορετικά. Ο Νεύτων έδειξε ότι ένα δεύτερο πρίσμα δεν αλλάζει ένα ήδη διαχωρισμένο χρώμα: τα χρώματα είναι ιδιότητα του φωτός και όχι του πρίσματος.');
}
AN.newton = [
 {h:'Το πλαίσιο', html:`<p>Το 1687, με παρότρυνση και χρηματοδότηση του Έντμουντ Χάλεϊ, ο Νεύτων δημοσίευσε τα «Μαθηματικά Αρχές της Φυσικής Φιλοσοφίας» (Principia). Σε ένα έργο ενοποίησε τα ευρήματα του Γαλιλαίου για την κίνηση και του Κέπλερ για τους πλανήτες. Η «Οπτική» (1704) συγκέντρωσε τα πειράματά του για το φως.</p>`},
 {h:'Οι τρεις νόμοι της κίνησης', html:`<ul><li><b>1ος (αδράνεια):</b> αν η συνισταμένη δύναμη είναι μηδέν, το σώμα παραμένει ακίνητο ή κινείται ευθύγραμμα και ομαλά.</li><li><b>2ος:</b> η επιτάχυνση είναι ανάλογη της συνισταμένης δύναμης και αντιστρόφως ανάλογη της μάζας.</li><li><b>3ος (δράση–αντίδραση):</b> όταν ένα σώμα ασκεί δύναμη σε άλλο, δέχεται από αυτό ίση και αντίθετη.</li></ul>${figForces()}

  ${CALC('newton',[['ΣF',50,'N'],['m',10,'kg']], v => v[0]/v[1], 'a =','m/s²')}`},
 {h:'Παγκόσμια έλξη', html:`<p>Δύο μάζες έλκονται με δύναμη ανάλογη του γινομένου τους και αντιστρόφως ανάλογη του τετραγώνου της απόστασής τους. Τον ίδιο νόμο ακολουθούν ένα μήλο που πέφτει και η Σελήνη που περιφέρεται γύρω από τη Γη. Ο Νεύτων το έδειξε με το «πείραμα σκέψης» του κανονιού.</p>${figCannon()}

  ${CALC('newton',[['m₁','5,97e24','kg'],['m₂','7,35e22','kg'],['r','3,84e8','m']], v => 6.674e-11*v[0]*v[1]/(v[2]*v[2]), 'F =','N')}`},
 {h:'Ανάλυση του φωτός', html:`<p>Περίπου το 1666 ο Νεύτων άφησε φως του Ήλιου να περάσει από ένα πρίσμα και πήρε μια ταινία χρωμάτων (το φάσμα). Τα έξι ή επτά χρώματα, από το κόκκινο έως το ιώδες, διαθλώνται σε διαφορετικό βαθμό. Δημοσίευσε τα πειράματα στην «Οπτική» το 1704.</p>${figPrism()}`},
 {h:'Γιατί έχει σημασία', html:`<p>Ο Νεύτων έδειξε ότι οι ίδιοι νόμοι ισχύουν στη Γη και στον ουρανό. Η κλασική μηχανική που θεμελίωσε εξηγεί από τη βαλλιστική και τις τροχιές των δορυφόρων μέχρι τα παλιρροϊκά φαινόμενα και χρησιμοποιείται ακόμη και σήμερα. Παράλληλα με τον Λάιμπνιτς ανέπτυξε τον διαφορικό λογισμό.</p><p>Σημείωση: η ιστορία ότι ένα μήλο τον χτύπησε στο κεφάλι είναι θρύλος. Κατά τον ίδιο, η ιδέα ήρθε βλέποντας ένα μήλο να πέφτει.</p>`}

/* ---------- Φαραντέι ---------- */
function figInd(){
  const st=[['Ο μαγνήτης πλησιάζει',1,35],['Ο μαγνήτης ακίνητος',0,0],['Ο μαγνήτης απομακρύνεται',-1,-35]];
  let s = '';
  st.forEach((q,k) => { const ox=k*233, mgx = ox + (q[1]===0?84:40);
    s += T_(ox+116,22,q[0],'ft','middle');
    for (let j=0;j<5;j++) s += '<ellipse class="fl" cx="'+(ox+150+j*9)+'" cy="100" rx="9" ry="30"/>';
    s += R_(mgx,88,60,24,'fo')+R_(mgx+30,88,30,24,'fz1')+T_(mgx+15,105,'S','fx','middle')+T_(mgx+45,105,'N','fx','middle');
    if (q[1]>0) s += AH_(ox+104,70,ox+136,70,'fa','fh'); if (q[1]<0) s += AH_(ox+96,70,ox+64,70,'fa','fh');
    s += L_(ox+150,130,ox+150,205,'fl')+L_(ox+186,130,ox+186,205,'fl');
    s += D_(ox+168,225,32,'fo');
    s += L_(ox+168-22,225-18,ox+168-18,225-6,'fd')+L_(ox+168+22,225-18,ox+168+18,225-6,'fd');
    const a=q[2]*Math.PI/180;
    s += L_(ox+168,243,ox+168+26*Math.sin(a),243-26*Math.cos(a),'fa')+D_(ox+168,243,3,'fp')+T_(ox+168,276,'G','ft','middle'); });
  return FIG_('700 290', s, 'Το γαλβανόμετρο δείχνει ρεύμα μόνο όσο κινείται ο μαγνήτης, δηλαδή όσο μεταβάλλεται η μαγνητική ροή στο πηνίο. Η φορά του ρεύματος αντιστρέφεται όταν ο μαγνήτης απομακρύνεται.');
}
function figField(){
  const cx=350, cy=150;
  let s = '';
  [35,62,92,124].forEach(L => {
    for (const sg of [1,-1]){ const pts=[]; for (let a=14;a<=166;a+=4){ const th=a*Math.PI/180, r=L*Math.sin(th)*Math.sin(th); pts.push([cx+r*Math.cos(th)*(-1)+0,cy-sg*r*Math.sin(th)]); }
      s += PL_(pts,'fb')+AH_(cx+5,cy-sg*L,cx-5,cy-sg*L,'fb','fhb',7); }
  });
  s += R_(305,138,90,24,'fo')+R_(350,138,45,24,'fz1')+T_(327,155,'S','fx','middle')+T_(372,155,'N','fx','middle');
  return FIG_('700 300', s, 'Σχηματική απεικόνιση των «γραμμών δύναμης» του Φαραντέι γύρω από ραβδόμορφο μαγνήτη. Δείχνουν τη διεύθυνση του μαγνητικού πεδίου, από τον βόρειο προς τον νότιο πόλο.');
}
function figElec(){

  s += R_(244,30,12,190,'fo')+R_(244,100,6,120,'fs')+R_(444,30,12,190,'fo');
  s += '<path d="M250,30 V10 H345" class="fl"/><path d="M355,10 H450 V30" class="fl"/>'+L_(345,2,345,18,'fk')+L_(355,-2,355,22,'fk');
  s += T_(250,264,'κάθοδος (−)','ft','middle')+T_(450,264,'άνοδος (+)','ft','middle');

  [[400,125],[400,165],[400,205]].forEach(p => { s += T_(p[0],p[1],'SO₄²⁻','fx','middle')+AH_(p[0]+26,p[1]-4,p[0]+48,p[1]-4,'fa','fh',6); });

}
AN.faraday = [
 {h:'Το πλαίσιο', html:`<p>Ο Φαραντέι (1791–1867) ήταν αυτοδίδακτος: ξεκίνησε ως βιβλιοδέτης και έγινε διευθυντής του εργαστηρίου του Βασιλικού Ιδρύματος (Royal Institution) στο Λονδίνο. Δούλευε με πειράματα και ελάχιστα μαθηματικά, και σκεφτόταν με εικόνες, όπως οι γραμμές δύναμης.</p>`},
 {h:'Η ηλεκτρομαγνητική επαγωγή (1831)', html:`<p>Ο Ørsted (Έρστεντ) είχε δείξει ότι το ρεύμα δημιουργεί μαγνητικό πεδίο. Ο Φαραντέι αναζήτησε το αντίστροφο και το βρήκε το 1831: ένας μαγνήτης που κινείται μέσα σε πηνίο προκαλεί ηλεκτρικό ρεύμα, αλλά μόνο όσο υπάρχει μεταβολή.</p>${figInd()}

 {h:'Η έννοια του πεδίου', html:`<p>Ο Φαραντέι δεν δεχόταν ότι οι μαγνήτες και τα φορτία δρουν «από απόσταση» χωρίς μεσολάβηση. Φαντάστηκε γραμμές δύναμης που γεμίζουν τον χώρο και δείχνουν τη διεύθυνση της δύναμης. Μπορούσε να τις δει διασκορπίζοντας ρινίσματα σιδήρου γύρω από μαγνήτη.</p>${figField()}
  <p>Η ιδέα του πεδίου έγινε η βάση του έργου του Μάξγουελ, που της έδωσε μαθηματική μορφή, και αργότερα της σύγχρονης φυσικής.</p>`},

  <div class="fm">m = (I·t / F) · (M / z)<small>F = 96485 C/mol (σταθερά Φαραντέι), M: γραμμομοριακή μάζα, z: φορτίο ιόντος</small></div>
  ${CALC('faraday',[['I',2,'A'],['t',30,'min'],['M',63.55,'g/mol'],['z',2,'']], v => v[0]*v[1]*60/96485*v[2]/v[3], 'm =','g (χαλκός)')}`},
 {h:'Γιατί έχει σημασία', html:`<p>Η επαγωγή άνοιξε τον δρόμο για την ηλεκτρική ενέργεια όπως τη γνωρίζουμε. Με τον περιστρεφόμενο δίσκο που κατασκεύασε το 1831 έφτιαξε την πρώτη ηλεκτρική γεννήτρια. Η σκέψη του με πεδία οδήγησε στη θεωρία του Μάξγουελ και στην πρόβλεψη των ηλεκτρομαγνητικών κυμάτων.</p>`}
];

/* ---------- Αναξίμανδρος ---------- */
function figCosmos(){
  const cx=270, cy=170;
  let s = D_(cx,cy,60,'fl')+D_(cx,cy,100,'fl')+D_(cx,cy,140,'fl');
  s += R_(cx-26,cy-9,52,18,'fo',3)+'<ellipse class="fo" cx="'+cx+'" cy="'+(cy-9)+'" rx="26" ry="6"/>';
  [[0,-1],[1,0],[0,1],[-1,0]].forEach(d => { s += L_(cx+d[0]*34,cy+d[1]*34,cx+d[0]*57,cy+d[1]*57,'fd'); });
  s += T_(cx,cy+30,'Γη','ft','middle');
  s += T_(440,60,'Δακτύλιος Ήλιου','fx')+L_(410,56,cx+99,cy-99,'fd')+T_(440,95,'Δακτύλιος Σελήνης','fx')+L_(410,91,cx+71,cy-71,'fd')+T_(440,130,'Δακτύλιος άστρων','fx')+L_(410,126,cx+42,cy-42,'fd');
  s += T_(440,200,'Η Γη απέχει εξίσου','ft')+T_(440,218,'προς όλες τις κατευθύνσεις,','ft')+T_(440,236,'άρα μένει ακίνητη.','ft');
  return FIG_('700 340', s, 'Σχηματική αναπαράσταση του κόσμου του Αναξίμανδρου: κυλινδρική Γη στο κέντρο και, κατά τις μεταγενέστερες πηγές, τρεις δακτύλιοι με φωτιά (άστρα, Σελήνη, Ήλιος). Οι αποστάσεις δεν είναι υπό κλίμακα.');
}
function figGnomon(){
  const gx=360, gy=250, h=110, E=[[65,'fa','καλοκαίρι'],[27,'fb','χειμώνας']];
  let s = L_(30,gy,670,gy,'fl')+L_(gx,gy,gx,gy-h,'fk')+D_(gx,gy-h,3,'fp');
  E.forEach(e => {
    const sh = h/Math.tan(e[0]*Math.PI/180), ex = gx-sh, dx = gx-ex, dy = -h, len = Math.hypot(dx,dy), ux = dx/len, uy = dy/len;
    s += L_(ex,gy,gx+ux*190,gy-h+uy*190,e[1]+' fdash')+L_(ex,gy+(e[0]>40?12:30),gx,gy+(e[0]>40?12:30),e[1])+T_(gx+14,gy+(e[0]>40?16:34),'σκιά '+e[2],'ft');
  });
  s += T_(gx+12,gy-h/2,'γνώμονας','ft');
  return FIG_('700 290', s, 'Ο Ήλιος ψηλά το καλοκαίρι δίνει κοντή σκιά και χαμηλά το χειμώνα μακριά σκιά. Το μήκος της μεσημεριανής σκιάς αλλάζει με την εποχή και έτσι ο γνώμονας δείχνει τον χρόνο του έτους.');
}
AN.anaximander = [
 {h:'Το πλαίσιο', html:`<p>Ο Αναξίμανδρος έζησε στη Μίλητο, μια γενιά μετά τον Θαλή. Ήταν ο πρώτος που έγραψε σύγγραμμα για τη φύση και τον κόσμο, αλλά δεν σώζεται παρά ένα μικρό απόσπασμα. Τα περισσότερα που γνωρίζουμε προέρχονται από μεταγενέστερους συγγραφείς, όπως ο Αριστοτέλης και ο Θεόφραστος.</p>
  <p>Ρώτησε «από τι προέρχονται τα πάντα» και απάντησε με το «άπειρον»: μια αόριστη, ανεξάντλητη αρχή, όχι κάποιο συγκεκριμένο στοιχείο όπως το νερό του Θαλή.</p>`},
 {h:'Η Γη στο κέντρο, χωρίς στήριγμα', html:`<p>Για τους προηγούμενους η Γη στηριζόταν σε νερό ή αέρα. Ο Αναξίμανδρος έκανε κάτι νέο: υποστήριξε ότι η Γη μένει στη θέση της επειδή βρίσκεται στο κέντρο και απέχει εξίσου από όλα, οπότε δεν υπάρχει λόγος να κινηθεί προς κάποια κατεύθυνση.</p>${figCosmos()}
  <ul><li>Είναι το πρώτο γνωστό επιχείρημα συμμετρίας στη φυσική: αν όλες οι κατευθύνσεις είναι ισοδύναμες, δεν ξεχωρίζει καμία.</li><li>Η Γη είχε σχήμα κυλίνδρου, με πλάτος τριπλάσιο του ύψους, και κατοικούμε στη μία βάση του. Οι μεταγενέστερες πηγές αναφέρουν ότι οι δακτύλιοι των άστρων είναι οι πιο κοντινοί και του Ήλιου ο πιο μακρινός.</li><li>Οι μεταγενέστερες πηγές διαφέρουν στα μεγέθη που αποδίδουν στους δακτυλίους, γι' αυτό δεν τα παραθέτουμε εδώ.</li></ul>`},

  ${CALC('anaximander',[['h',1,'m'],['α',60,'°']], v => v[0]/Math.tan(v[1]*Math.PI/180), 's =','m')}`},
 {h:'Αξία και όρια', html:`<p>Ο Αναξίμανδρος εισήγαγε μια τάση που διατρέχει όλη τη φυσική: αναζήτηση αρχών που εξηγούν πολλά φαινόμενα με ένα επιχείρημα. Η ιδέα ότι ο κόσμος μπορεί να περιγραφεί γεωμετρικά και ότι η Γη δεν στηρίζεται πουθενά ήταν προϋπόθεση για τη μεταγενέστερη αστρονομία.</p>
  <p>Οι ιδέες του δεν είχαν πειραματικό έλεγχο και το κυλινδρικό σχήμα της Γης αντικαταστάθηκε σύντομα από τη σφαιρική Γη του Πυθαγόρα και του Παρμενίδη.</p>`},
 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Αναξίμανδρος πρότεινε ότι η Γη κινείται».</b> Την ήθελε ακίνητη. Αυτό που ανακάλυψε είναι ότι δεν χρειάζεται στήριγμα.</li><li><b>«Η ιδέα του για το άπειρον είναι άτομα ή ενέργεια».</b> Είναι φιλοσοφική έννοια και δεν πρέπει να ταυτίζεται με σύγχρονες έννοιες.</li><li><b>«Ο γνώμονας είναι δικό του εφεύρημα».</b> Ο γνώμονας ήταν γνωστός στους Βαβυλώνιους. Η παράδοση λέει ότι ο Αναξίμανδρος τον έφερε στην Ελλάδα.</li></ul>`}
];

/* ---------- Πυθαγόρας ---------- */
function figStrings(){
  const x0=70, Lp=480, rows=[[1,'θεμελιώδης','1'],[3/4,'τέταρτη','3/4 · λόγος 4:3'],[2/3,'πέμπτη','2/3 · λόγος 3:2'],[1/2,'οκτάβα','1/2 · λόγος 2:1']];
  let s = '';
  rows.forEach((r,i) => {
    const y = 50+i*62, xe = x0+Lp*r[0];
    s += R_(x0-10,y-14,10,28,'fo',2)+L_(x0,y,xe,y,i===0?'fa':'fb')+R_(xe,y-12,8,24,'fo',2)+D_(xe+4,y,0,'fp');
    s += T_(x0+Lp+22,y-2,r[1],'fx')+T_(x0+Lp+22,y+16,r[2],'ft');
  });
  return FIG_('700 290', s, 'Αν η χορδή κοντύνει στα 3/4, ο ήχος ανεβαίνει κατά μία τέταρτη. Στα 2/3 ανεβαίνει κατά μία πέμπτη και στο μισό κατά μία οκτάβα. Η συχνότητα είναι αντιστρόφως ανάλογη του μήκους (σταθερή τάση).');
}

  s += PG_([A,B,C],'fo')+PL_([[220,248],[232,248],[232,260]],'fa');
  s += T_(175,220,'9','fx','middle')+T_(280,325,'16','fx','middle')+T_(325,150,'25','fx','middle');

  s += T_(500,170,'3² + 4² = 5²','fx')+T_(500,194,'9 + 16 = 25','ft')+T_(500,226,'α² + β² = γ²','fx');
  return FIG_('700 400', s, 'Στο ορθογώνιο τρίγωνο 3-4-5 το εμβαδόν του τετραγώνου της υποτείνουσας ισούται με το άθροισμα των εμβαδών των τετραγώνων των κάθετων πλευρών. Το αποτέλεσμα ισχύει για κάθε ορθογώνιο τρίγωνο.');
}
AN.pythagoras = [

  <p>Στη φυσική το θεώρημα χρησιμοποιείται παντού: στην ανάλυση διανυσμάτων, στο μέτρο της ταχύτητας από τις συνιστώσες της και στην απόσταση δύο σημείων στο επίπεδο.</p>`},
 {h:'Γιατί έχει σημασία', html:`<p>Η ιδέα ότι οι νόμοι της φύσης εκφράζονται με μαθηματικές σχέσεις είναι κεντρική στη νεότερη φυσική. Ο Γαλιλαίος έγραψε ότι το βιβλίο της φύσης είναι γραμμένο στη γλώσσα των μαθηματικών, και η θέση αυτή έχει πυθαγόρεια ρίζα.</p>

 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Πυθαγόρας απέδειξε το θεώρημα».</b> Δεν υπάρχει αξιόπιστη μαρτυρία και η σχέση ήταν ήδη γνωστή.</li><li><b>«Η αρμονία των σφαιρών είναι κάτι που ακούγεται».</b> Ήταν συμβολική ιδέα, όχι πραγματικός ήχος.</li><li><b>«Η μουσική αρμονία προκύπτει από ακέραιους λόγους, και μόνο».</b> Οι σημερινές κλίμακες προσαρμόζουν τους λόγους (π.χ. ισοσυγκερασμένο σύστημα) για να χρησιμοποιούνται σε όλες τις τονικότητες.</li></ul>`}

/* ---------- Δημόκριτος ---------- */
function figDivide(){
  let s = '';
  for (let i=0;i<5;i++){ const w = 460/Math.pow(2,i), y = 30+i*46; s += R_(70,y,w,22,'fz1')+T_(70+w+12,y+16,'÷ '+Math.pow(2,i)+(i===0?'  (αρχικό κομμάτι)':''),'ft'); }
  s += T_(70,270,'… και ύστερα από πολλές ακόμη διαιρέσεις …','ft')+D_(76,302,6,'fp')+T_(94,307,'άτομο: δεν διαιρείται άλλο','fx');
  return FIG_('700 330', s, 'Διαδοχικές διαιρέσεις στη μέση. Ο Δημόκριτος υποστήριξε ότι η διαδικασία δεν συνεχίζεται απεριόριστα: υπάρχει ελάχιστο, αδιαίρετο κομμάτι.');
}
function figAtoms(){
  const sh = (t,x,y,r) => t===0 ? D_(x,y,r,'fo') : t===1 ? R_(x-r,y-r,2*r,2*r,'fo',2) : PG_([[x,y-r],[x+r,y+r*0.8],[x-r,y+r*0.8]],'fo');
  const P = [[0,150,90,14],[1,300,70,12],[2,470,100,15],[1,560,200,13],[0,230,200,16],[2,380,230,12],[0,120,230,10],[1,520,80,10]];
  let s = R_(40,30,620,250,'fl',6);
  P.forEach(p => { s += sh(p[0],p[1],p[2],p[3]); });
  [[150,90,215,130],[300,70,350,120],[470,100,420,150],[560,200,500,250],[230,200,175,235],[380,230,330,200]].forEach(a => { s += AH_(a[0],a[1],a[2],a[3],'fa','fh',7); });
  s += T_(350,160,'κενό','ft','middle');
  return FIG_('700 310', s, 'Άτομα με διαφορετικά σχήματα και μεγέθη κινούνται στο κενό και συγκρούονται. Οι ιδιότητες των σωμάτων προέρχονται από τον τρόπο που ενώνονται τα άτομα.');
}
AN.democritus = [
 {h:'Το πλαίσιο', html:`<p>Ο Δημόκριτος γεννήθηκε στα Άβδηρα της Θράκης και συνεχίζει τη σκέψη του δασκάλου του, του Λεύκιππου. Έγραψε πάρα πολλά έργα, αλλά σώζονται μόνο αποσπάσματα και μαρτυρίες, κυρίως από τον Αριστοτέλη, που τον κρίνει αυστηρά αλλά τον παίρνει στα σοβαρά.</p>
  <p>Οι Ελεάτες φιλόσοφοι είχαν υποστηρίξει ότι η κίνηση και η πολλαπλότητα είναι αδύνατες. Η ατομική θεωρία ήταν απάντηση: αν υπάρχουν άτομα και κενό, η κίνηση και η αλλαγή γίνονται κατανοητές.</p>`},
 {h:'Το αδιαίρετο', html:`<p>Η λέξη «άτομον» σημαίνει «αδιαίρετο». Αν η ύλη μπορούσε να διαιρείται επ' άπειρον, δεν θα υπήρχε τίποτα συγκεκριμένο, μόνο μια ατέλειωτη διαδικασία. Ο Δημόκριτος δέχτηκε ότι υπάρχει όριο.</p>${figDivide()}
  <div class="fm">n = log₂(L / d)<small>n: αριθμός διαδοχικών διαιρέσεων στη μέση, L: αρχικό μήκος, d: μέγεθος ατόμου</small></div>
  ${CALC('democritus',[['L',0.01,'m'],['d','1e-10','m']], v => Math.log2(v[0]/v[1]), 'n ≈','διαιρέσεις')}
  <p>Ένα κομμάτι μήκους 1 cm χρειάζεται περίπου 27 διαδοχικές διαιρέσεις στη μέση για να φτάσει στο μέγεθος ενός ατόμου (10⁻¹⁰ m). Ο Δημόκριτος, βέβαια, δεν γνώριζε αυτή την κλίμακα.</p>`},
 {h:'Άτομα και κενό', html:`<p>Τα άτομα είναι αιώνια, αμετάβλητα και διαφέρουν σε σχήμα, μέγεθος και θέση. Κινούνται μέσα σε κενό χώρο. Τα σώματα που βλέπουμε προκύπτουν από συνδυασμούς ατόμων, και η αλλαγή είναι αναδιάταξη.</p>${figAtoms()}
  <ul><li>Το κενό είναι αναγκαίο, αλλιώς τα άτομα δεν θα είχαν χώρο να κινηθούν. Η αποδοχή του «μη όντος» ήταν τολμηρή για την εποχή.</li><li>Ο Δημόκριτος δίδασκε ότι χρώμα, γεύση και θερμότητα δεν ανήκουν στα ίδια τα άτομα αλλά στον τρόπο που τα αντιλαμβανόμαστε. Μοιάζει με τη σύγχρονη διάκριση πρωτευουσών και δευτερευουσών ιδιοτήτων.</li><li>Το μοντέλο εξηγεί ποιοτικά πολλά: γιατί οι ουσίες αναμιγνύονται, γιατί η ύλη συμπιέζεται, γιατί η οσμή διαδίδεται.</li></ul>`},
 {h:'Από τη φιλοσοφία στην επιστήμη', html:`<p>Η ιδέα έμεινε στο περιθώριο επί αιώνες, επειδή ο Αριστοτέλης την απέρριψε. Επανήλθε τον 17ο αιώνα με τον Γκασεντί και τον Μπόιλ και, το 1808, ο Ντάλτον τη στήριξε με μετρήσεις της χημείας. Το 1905 ο Αϊνστάιν, με την ερμηνεία της κίνησης Μπράουν, έδωσε ισχυρή απόδειξη ότι τα μόρια υπάρχουν.</p>

 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Δημόκριτος ανακάλυψε το άτομο».</b> Πρότεινε μια φιλοσοφική ιδέα. Η πειραματική ανακάλυψη ήρθε πολύ αργότερα.</li><li><b>«Τα άτομα του Δημόκριτου είναι τα σημερινά άτομα».</b> Τα σημερινά διαιρούνται σε μικρότερα σωματίδια.</li><li><b>«Η θεωρία του ήταν εντελώς λανθασμένη, επειδή δεν είχε απόδειξη».</b> Ήταν ορθή ποιοτικά, ακόμη κι αν δεν μπορούσε να ελεγχθεί τότε.</li></ul>`}

/* ---------- Ευκλείδης ---------- */
function figVisual(){
  let s = D_(60,160,16,'fo')+D_(60,160,5,'fp')+L_(330,105,330,215,'fk')+L_(560,105,560,215,'fk');
  s += L_(76,160,330,105,'fa')+L_(76,160,330,215,'fa')+L_(76,160,560,105,'fb fdash')+L_(76,160,560,215,'fb fdash');
  s += '<path class="fa" d="M140,160 A80 80 0 0 0 138,144"/><path class="fb" d="M200,160 A140 140 0 0 0 198,152"/>';
  s += T_(330,95,'κοντά','ft','middle')+T_(560,95,'μακριά','ft','middle')+T_(60,200,'μάτι','ft','middle')+T_(330,240,'μεγάλη γωνία: μεγάλο','ft','middle')+T_(560,240,'μικρή γωνία: μικρό','ft','middle');
  return FIG_('700 270', s, 'Δύο αντικείμενα ίδιου ύψους. Το πιο μακρινό φαίνεται υπό μικρότερη γωνία, άρα το βλέπουμε μικρότερο. Στο μοντέλο του Ευκλείδη οι ακτίνες ξεκινούν από το μάτι, αλλά η γεωμετρία των γωνιών είναι ίδια.');
}
function figReflect(){
  const my=170, nx=350, sx=150, sy=40, th=Math.atan2(nx-sx, my-sy), ux=Math.sin(th), uy=Math.cos(th);
  let s = L_(60,my,640,my,'fk');
  for (let x=70;x<640;x+=26) s += L_(x,my,x-12,my+14,'fg');
  s += L_(nx,my-130,nx,my,'fd')+AH_(sx,sy,nx,my,'fa','fh')+AH_(nx,my,nx+(nx-sx),sy,'fb','fhb');
  s += L_(nx,my,sx,2*my-sy,'fd')+D_(sx,2*my-sy,3,'fp')+T_(sx+8,2*my-sy+4,'είδωλο','ft');
  s += '<path class="fd" d="M'+nx+','+(my-56)+' A56 56 0 0 0 '+N1(nx-56*ux)+','+N1(my-56*uy)+'"/><path class="fd" d="M'+nx+','+(my-56)+' A56 56 0 0 1 '+N1(nx+56*ux)+','+N1(my-56*uy)+'"/>';
  s += T_(nx-30,my-66,'θ','fx','middle')+T_(nx+30,my-66,'θ','fx','middle')+T_(sx-10,sy-8,'πηγή','ft','middle')+T_(nx+4,my-136,'κάθετη','ft');
  return FIG_('700 330', s, 'Η ακτίνα που πέφτει στον καθρέφτη ανακλάται με γωνία ίση με τη γωνία πρόσπτωσης. Η ανακλώμενη ακτίνα φαίνεται να προέρχεται από το είδωλο, που βρίσκεται το ίδιο μακριά πίσω από τον καθρέφτη.');
}
AN.euclid = [

 {h:'Ευθείες ακτίνες και οπτική γωνία', html:`<p>Στα «Οπτικά» το φως διαδίδεται σε ευθείες γραμμές. Το μάτι βλέπει ένα αντικείμενο μέσα σε κώνο ακτίνων και το φαινόμενο μέγεθος εξαρτάται από τη γωνία του κώνου: όσο μεγαλύτερη η γωνία, τόσο μεγαλύτερο φαίνεται.</p>${figVisual()}

/* ---------- Αρίσταρχος ---------- */
function figQuarter(){
  const phi=70*Math.PI/180, E=[100,270], S=[600,270], d=500*Math.cos(phi), M=[E[0]+d*Math.cos(phi), E[1]-d*Math.sin(phi)];
  let s = L_(E[0],E[1],S[0],S[1],'fl')+L_(E[0],E[1],M[0],M[1],'fb')+L_(M[0],M[1],S[0],S[1],'fa fdash');
  s += '<path class="fd" d="M'+(E[0]+60)+','+E[1]+' A60 60 0 0 0 '+N1(E[0]+60*Math.cos(phi))+','+N1(E[1]-60*Math.sin(phi))+'"/>'+T_(E[0]+78,E[1]-14,'φ','fx');
  const ux=Math.cos(phi), uy=-Math.sin(phi), vx=(S[0]-M[0])/Math.hypot(S[0]-M[0],S[1]-M[1]), vy=(S[1]-M[1])/Math.hypot(S[0]-M[0],S[1]-M[1]);
  s += PL_([[M[0]-ux*14,M[1]-uy*14],[M[0]-ux*14+vx*14,M[1]-uy*14+vy*14],[M[0]+vx*14,M[1]+vy*14]],'fa');
  s += D_(E[0],E[1],9,'fo')+T_(E[0],E[1]+28,'Γη','ft','middle')+D_(M[0],M[1],6,'fp')+T_(M[0]+12,M[1]-8,'Σελήνη στο πρώτο τέταρτο','ft')+D_(S[0],S[1],10,'fs')+T_(S[0],S[1]+28,'Ήλιος','ft','middle');
  s += T_(M[0]+16,M[1]+22,'90°','fx');
  return FIG_('700 310', s, 'Όταν η Σελήνη φωτίζεται ακριβώς κατά το ήμισυ, η γωνία Γη–Σελήνη–Ήλιος είναι 90°. Η μέτρηση της γωνίας φ στη Γη δίνει τον λόγο των αποστάσεων: cos φ = d(Γης–Σελήνης) / d(Γης–Ήλιου). Το σχήμα δεν είναι υπό κλίμακα: η πραγματική γωνία φ είναι σχεδόν 90°.');
}
function figParallax(){
  const sx=350, sy=190, R=100, A=[sx-R,sy], B=[sx+R,sy], N=[sx,70];
  let s = D_(sx,sy,R,'fl')+D_(sx,sy,10,'fs')+T_(sx,sy+30,'Ήλιος','ft','middle');
  s += L_(A[0],A[1],N[0],N[1],'fa')+L_(B[0],B[1],N[0],N[1],'fa')+D_(N[0],N[1],4,'fp')+T_(N[0]+10,N[1]-4,'κοντινό άστρο','ft');
  s += L_(A[0],A[1],A[0],18,'fb fdash')+L_(B[0],B[1],B[0],18,'fb fdash')+T_(sx,12,'πολύ μακρινά άστρα: ίδια κατεύθυνση από κάθε θέση','ft','middle');
  s += D_(A[0],A[1],6,'fo')+D_(B[0],B[1],6,'fo')+T_(A[0]-14,A[1]+4,'Γη','ft','end')+T_(B[0]+14,B[1]+4,'Γη','ft');
  return FIG_('700 310', s, 'Αν η Γη κινείται γύρω από τον Ήλιο, η κατεύθυνση ενός κοντινού άστρου θα άλλαζε μέσα στον χρόνο (παράλλαξη). Οι αρχαίοι δεν την παρατηρούσαν, επειδή τα άστρα είναι εξαιρετικά μακριά.');
}
AN.aristarchus = [
 {h:'Το πλαίσιο', html:`<p>Ο Αρίσταρχος γεννήθηκε στη Σάμο και εργάστηκε στην Αλεξάνδρεια τον 3ο αιώνα π.Χ. Το μόνο σωζόμενο έργο του είναι το «Περί μεγεθών και αποστάσεων Ηλίου και Σελήνης». Η ηλιοκεντρική ιδέα του γνωρίζεται από μαρτυρία του Αρχιμήδη στον «Ψαμμίτη» και από τον Πλούταρχο.</p>`},
 {h:'Η μέθοδος του πρώτου τετάρτου', html:`<p>Όταν η Σελήνη φαίνεται ακριβώς μισή, το τρίγωνο Γη–Σελήνη–Ήλιος έχει ορθή γωνία στη Σελήνη. Αν μετρήσουμε τη γωνία φ ανάμεσα στη Σελήνη και τον Ήλιο όπως φαίνονται από τη Γη, βρίσκουμε τον λόγο των αποστάσεων με απλή τριγωνομετρία.</p>

 {h:'Αξία και όρια', html:`<p>Ο Αρίσταρχος δίνει δύο διδάγματα. Πρώτον, με απλά γεωμετρικά επιχειρήματα μπορούμε να κάνουμε εκτιμήσεις αποστάσεων στο διάστημα. Δεύτερον, η ακρίβεια των μετρήσεων καθορίζει την αξία ενός σωστού συλλογισμού.</p>
  <p>Η ηλιοκεντρική του ιδέα δεν υιοθετήθηκε, αλλά ο Κοπέρνικος την ανέφερε στο χειρόγραφο του έργου του «Περί των επαναστάσεων», πριν διαγράψει το σχετικό χωρίο.</p>`},
 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Αρίσταρχος απέδειξε ότι η Γη κινείται».</b> Πρότεινε την υπόθεση, χωρίς να μπορεί να την αποδείξει.</li><li><b>«Οι αποστάσεις του ήταν σωστές».</b> Όχι, αλλά η μέθοδος ήταν σωστή.</li><li><b>«Μετά τον Αρίσταρχο όλοι έγιναν ηλιοκεντρικοί».</b> Ο Σέλευκος ο Βαβυλώνιος τον ακολούθησε αργότερα, αλλά η πλειοψηφία έμεινε στο γεωκεντρικό.</li></ul>`}
];

/* ---------- Ίππαρχος ---------- */
function figPrecession(){
  const cx=330, cy=200, a=23.4*Math.PI/180, L=140, tx=cx+L*Math.sin(a), ty=cy-L*Math.cos(a), bx=cx-L*Math.sin(a), by=cy+L*Math.cos(a);
  let s = L_(cx,cy-165,cx,cy+165,'fd')+D_(cx,cy,56,'fo')+'<ellipse class="fd" cx="'+cx+'" cy="'+N1(cy-L*Math.cos(a))+'" rx="'+N1(L*Math.sin(a))+'" ry="16"/>';
  s += '<path class="fl" d="M'+N1(cx-64)+','+cy+' A64 18 0 0 0 '+N1(cx+64)+','+cy+'"/>';
  s += L_(bx,by,tx,ty,'fk')+D_(tx,ty,4,'fp')+T_(tx+14,ty-6,'Βόρειος πόλος του άξονα','ft');
  s += AH_(cx+L*Math.sin(a)*0.2,cy-L*Math.cos(a)-16,cx-L*Math.sin(a)*0.4,cy-L*Math.cos(a)-15,'fa','fh',7);
  s += T_(cx+16,cy-170,'κάθετη στην εκλειπτική','ft')+T_(cx+68,cy+34,'ισημερινός','ft')+T_(cx+78,cy+78,'μία περιστροφή','ft')+T_(cx+78,cy+96,'σε περίπου 25.800 έτη','ft');
  return FIG_('700 400', s, 'Η Γη κλίνει κατά 23,4° και ο άξονάς της διαγράφει αργά κώνο γύρω από την κάθετη στην εκλειπτική, όπως μια σβούρα που τρεκλίζει. Έτσι το εαρινό σημείο μετατοπίζεται ως προς τα άστρα.');
}
function figMagn(){
  let s = '';
  for (let m=1;m<=6;m++){
    const b = Math.pow(100,(6-m)/5), r = 3*Math.sqrt(b), x = 80+(m-1)*108;
    s += D_(x,110,r,'fp')+T_(x,200,m+'ο','fx','middle')+T_(x,222,'×'+(b>=10?Math.round(b):String(+b.toFixed(1)).replace('.',',')),'ft','middle');
  }
  s += T_(40,254,'Κάθε βήμα μεγέθους = × 2,512 σε φωτεινότητα.','ft')+T_(40,274,'Το 1ο μέγεθος είναι 100 φορές πιο λαμπρό από το 6ο.','ft');
  return FIG_('700 290', s, 'Τα έξι μεγέθη του Ίππαρχου (1 = πιο λαμπρά, 6 = ό,τι φαίνεται με γυμνό μάτι). Η ακτίνα κάθε κύκλου είναι ανάλογη της τετραγωνικής ρίζας της σχετικής φωτεινότητας.');
}
AN.hipparchus = [
 {h:'Το πλαίσιο', html:`<p>Ο Ίππαρχος γεννήθηκε στη Νίκαια της Βιθυνίας και παρατήρησε από τη Ρόδο, τον 2ο αιώνα π.Χ. Από το έργο του σώζεται μόνο ένα σχόλιο σε ποίημα του Αράτου. Τα υπόλοιπα τα γνωρίζουμε κυρίως μέσω του Πτολεμαίου, που τον παραθέτει συχνά.</p>
  <p>Η μεγάλη του καινοτομία ήταν ότι συνέκρινε συστηματικά τις δικές του μετρήσεις με παλαιότερες, βαβυλωνιακές και ελληνικές, και έτσι ανίχνευσε αργές αλλαγές που δεν φαίνονται σε μία ζωή.</p>`},
 {h:'Κατάλογος άστρων και μεγέθη', html:`<p>Σύμφωνα με την παράδοση κατέγραψε τη θέση και τη λαμπρότητα περίπου 850 άστρων. Χώρισε τη λαμπρότητα σε έξι τάξεις: τα πιο λαμπρά ήταν του 1ου μεγέθους και τα αμυδρότερα που φαίνονται με γυμνό μάτι του 6ου.</p>${figMagn()}
  <div class="fm">λόγος φωτεινότητας = 100<sup>Δm/5</sup><small>Δm: διαφορά μεγεθών. Ο σύγχρονος ορισμός (Πόγκσον, 1856) ταιριάζει σε αυτή την αρχαία κλίμακα.</small></div>

  <ul><li>Η κλίμακα είναι λογαριθμική, γιατί το μάτι αντιλαμβάνεται λόγους φωτεινότητας και όχι διαφορές.</li><li>Οι σημερινές τιμές ξεπερνούν το εύρος του Ίππαρχου: ο Σείριος έχει −1,46 και ο Ήλιος −26,7.</li></ul>`},
 {h:'Η μετάπτωση των ισημεριών', html:`<p>Συγκρίνοντας τη θέση του άστρου Σπίκα με παλαιότερες παρατηρήσεις, ο Ίππαρχος βρήκε ότι οι γεωγραφικές του συντεταγμένες είχαν αυξηθεί. Το συμπέρασμα ήταν ότι το σημείο της εαρινής ισημερίας δεν είναι σταθερό ως προς τα άστρα, αλλά μετακινείται.</p>${figPrecession()}
  <div class="fm">Δλ = ρ · Δt<small>ρ ≈ 50,3″ ανά έτος (σημερινή τιμή). Ο Ίππαρχος βρήκε τουλάχιστον 1° ανά αιώνα, δηλαδή περίπου 36″ ανά έτος.</small></div>
  ${CALC('hipparchus',[['Δt',100,'έτη']], v => v[0]*50.3/3600, 'Δλ =','°')}
  <p>Η αιτία της μετάπτωσης εξηγήθηκε από τον Νεύτωνα: η έλξη του Ήλιου και της Σελήνης στο ισημερινό εξόγκωμα της Γης ασκεί ροπή στον άξονα. Η περίοδος είναι περίπου 25.800 έτη.</p>`},
 {h:'Τριγωνομετρία και Σελήνη', html:`<p>Για να υπολογίζει θέσεις, ο Ίππαρχος συνέταξε πίνακες χορδών κύκλου, που είναι οι πρώτοι τριγωνομετρικοί πίνακες. Με παρατηρήσεις της παράλλαξης της Σελήνης και εκλείψεων έκανε εκτίμηση της απόστασής της, της τάξης των 60 έως 80 γήινων ακτίνων, ενώ η σύγχρονη μέση τιμή είναι περίπου 60.</p>`},
 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Ίππαρχος ανακάλυψε ότι η Γη γυρίζει σαν σβούρα».</b> Παρατήρησε τη μετατόπιση των ισημεριών. Η φυσική εξήγηση ήρθε αιώνες αργότερα.</li><li><b>«Ο πολικός αστέρας ήταν πάντα ο ίδιος».</b> Λόγω μετάπτωσης ο πόλος αλλάζει: σήμερα ο Πολικός είναι κοντά στον βόρειο ουράνιο πόλο, αλλά δεν θα είναι πάντα.</li><li><b>«Η κλίμακα μεγεθών είναι γραμμική».</b> Είναι λογαριθμική και ανάποδη: μικρότερος αριθμός σημαίνει πιο λαμπρό άστρο.</li></ul>`}
];

/* ---------- Ήρων ---------- */
function figAeolipile(){
  let s = R_(230,290,240,56,'fo',6)+T_(350,325,'νερό · φωτιά','ft','middle');
  s += L_(330,290,330,196,'fk')+L_(370,290,370,196,'fk')+D_(350,150,56,'fo');
  s += PL_([[294,150],[270,150],[270,190]],'fk')+PL_([[406,150],[430,150],[430,110]],'fk');
  s += AH_(270,192,270,236,'fb','fhb')+AH_(430,108,430,64,'fb','fhb')+T_(284,222,'ατμός','ft')+T_(444,86,'ατμός','ft');
  s += '<path class="fa" d="M300,92 A68 68 0 0 1 400,92"/>'+AH_(392,90,400,100,'fa','fh',7);
  s += T_(350,66,'περιστροφή','ft','middle');
  return FIG_('700 360', s, 'Ο ατμός ανεβαίνει από τον λέβητα στη σφαίρα και βγαίνει από δύο λυγισμένα ακροφύσια. Η σφαίρα ωθείται προς την αντίθετη κατεύθυνση και περιστρέφεται.');
}
function figMinPath(){
  const my=200, A=[150,70], B=[550,70], Bi=[550,330], P0=[350,200], P2=[260,200];
  let s = L_(60,my,640,my,'fk');
  for (let x=70;x<640;x+=26) s += L_(x,my,x-12,my+14,'fg');
  s += L_(A[0],A[1],Bi[0],Bi[1],'fd')+PL_([A,P2,B],'fb')+PL_([A,P0,B],'fa');
  s += D_(A[0],A[1],5,'fp')+T_(A[0]-10,A[1]-10,'Α','fx','middle')+D_(B[0],B[1],5,'fp')+T_(B[0]+10,B[1]-10,'Β','fx','middle')+D_(Bi[0],Bi[1],4,'fp')+T_(Bi[0]+10,Bi[1]+16,'Β′ (είδωλο)','ft','middle');
  s += D_(P0[0],P0[1],4,'fp')+T_(P0[0],P0[1]+36,'P','fx','middle')+D_(P2[0],P2[1],4,'fp')+T_(P2[0],P2[1]+36,'P′','fx','middle');
  s += T_(60,290,'κίτρινη: ελάχιστη διαδρομή (ίσες γωνίες)','ft')+T_(60,310,'μπλε: μακρύτερη διαδρομή','ft');
  return FIG_('700 365', s, 'Από όλα τα σημεία P του καθρέφτη, η διαδρομή Α→P→Β είναι ελάχιστη όταν το P βρίσκεται πάνω στην ευθεία ΑΒ′ (όπου Β′ το είδωλο του Β). Τότε οι γωνίες πρόσπτωσης και ανάκλασης είναι ίσες.');
}
AN.hero = [
 {h:'Το πλαίσιο', html:`<p>Ο Ήρων δούλεψε στην Αλεξάνδρεια τον 1ο αιώνα μ.Χ. Έγραψε για μαθηματικά, μηχανική και φυσική: «Πνευματικά», «Μηχανικά», «Μετρικά», «Κατοπτρικά». Τον ενδιαφέρουν οι πρακτικές συσκευές και ο τρόπος λειτουργίας τους.</p>`},
 {h:'Η αιολόσφαιρα', html:`<p>Η αιολόσφαιρα είναι μια κοίλη σφαίρα που στηρίζεται σε δύο σωλήνες μέσα από τους οποίους μπαίνει ατμός. Ο ατμός βγαίνει από δύο λυγισμένα ακροφύσια και η σφαίρα περιστρέφεται.</p>${figAeolipile()}
  <div class="fm">F = ṁ · v<small>F: ώθηση, ṁ: μάζα ατμού που εκτοξεύεται ανά δευτερόλεπτο, v: ταχύτητα εξόδου</small></div>
  ${CALC('hero',[['ṁ',0.001,'kg/s'],['v',100,'m/s']], v => v[0]*v[1], 'F =','N')}

 {h:'Η συντομότερη διαδρομή του φωτός', html:`<p>Στα «Κατοπτρικά» ο Ήρων έδειξε ότι, όταν το φως πηγαίνει από ένα σημείο σε άλλο μέσω καθρέφτη, η διαδρομή που ακολουθεί είναι η συντομότερη. Η απόδειξη χρησιμοποιεί το είδωλο και απλή γεωμετρία.</p>${figMinPath()}
  <p>Η ιδέα ότι η φύση «επιλέγει» τη συντομότερη διαδρομή έγινε αργότερα η αρχή του ελάχιστου χρόνου του Φερμά (1662), που εξηγεί και τη διάθλαση.</p>`},
 {h:'Ο τύπος του Ήρωνα', html:`<p>Ο Ήρων έδωσε τρόπο να βρεθεί το εμβαδόν τριγώνου από τις τρεις πλευρές, χωρίς ύψος.</p>
  <div class="fm">E = √( s(s−α)(s−β)(s−γ) ),  s = (α+β+γ)/2</div>
  ${CALC('hero',[['α',13,''],['β',14,''],['γ',15,'']], v => { const s=(v[0]+v[1]+v[2])/2; return Math.sqrt(s*(s-v[0])*(s-v[1])*(s-v[2])); }, 'E =','')}
  <p>Για το τρίγωνο 13–14–15 ο τύπος δίνει 84. Αν οι πλευρές δεν σχηματίζουν τρίγωνο, δεν υπάρχει αποτέλεσμα (το πεδίο εμφανίζει «–»).</p>`},
 {h:'Συνηθισμένες παρανοήσεις', html:`<ul><li><b>«Ο Ήρων εφηύρε την ατμομηχανή».</b> Η αιολόσφαιρα έδειξε την αρχή, αλλά η ατμομηχανή έγινε χιλιάδες χρόνια αργότερα, με τους Νιουκόμεν και Βατ.</li><li><b>«Οι ανακαλύψεις του έμειναν χωρίς χρήση επειδή οι αρχαίοι αγνοούσαν την επιστήμη».</b> Οι λόγοι ήταν οικονομικοί και τεχνολογικοί.</li><li><b>«Ο τύπος του Ήρωνα είναι δικός του».</b> Ίσως ήταν ήδη γνωστός στον Αρχιμήδη, αλλά η πρώτη γραπτή απόδειξη είναι στα «Μετρικά».</li></ul>`}
];

/* ---------- Πτολεμαίος ---------- */
function figEpicycle(){
  const cx=300, cy=175, R=125, r=42, k=7;
  let s = D_(cx,cy,R,'fd')+D_(cx,cy,9,'fo')+T_(cx,cy+26,'Γη','ft','middle');
  let pts = [];
  for (let t=0.25;t<1.7;t+=0.01) pts.push([cx+R*Math.cos(t)+r*Math.cos(k*t), cy-R*Math.sin(t)-r*Math.sin(k*t)]);
  s += PL_(pts,'fa');
  const t0 = 1.0, C=[cx+R*Math.cos(t0), cy-R*Math.sin(t0)], P=[C[0]+r*Math.cos(k*t0), C[1]-r*Math.sin(k*t0)];
  s += D_(C[0],C[1],r,'fl')+L_(cx,cy,C[0],C[1],'fd')+L_(C[0],C[1],P[0],P[1],'fb')+D_(C[0],C[1],3,'fp')+D_(P[0],P[1],5,'fmb');
  s += T_(470,70,'φορέας (μεγάλος κύκλος)','fx');
  s += T_(470,115,'επίκυκλος','fx')+T_(470,135,'(μικρός κύκλος)','ft');
  s += T_(470,190,'διαδρομή πλανήτη:','fx')+T_(470,210,'βρόχοι, δηλαδή αναδρομή','ft');
  return FIG_('700 340', s, 'Ο πλανήτης κινείται σε μικρό κύκλο (επίκυκλο) που το κέντρο του διαγράφει τον φορέα γύρω από τη Γη. Ο συνδυασμός των δύο κινήσεων δίνει βρόχους, δηλαδή τη φαινομενική αναδρομή. Σχηματικό, χωρίς τους έκκεντρους και τον ισοδύναμο.');
}
function figRefractP(){
  const iy=170, nx=350, t1=40*Math.PI/180, t2=Math.asin(Math.sin(t1)/1.333), L=150;
  let s = R_(30,iy,640,150,'fz1')+L_(30,iy,670,iy,'fk')+L_(nx,iy-140,nx,iy+145,'fd');
  s += AH_(nx-L*Math.sin(t1),iy-L*Math.cos(t1),nx,iy,'fa','fh')+AH_(nx,iy,nx+L*Math.sin(t2),iy+L*Math.cos(t2),'fb','fhb');
  s += L_(nx,iy,nx+L*Math.sin(t1),iy+L*Math.cos(t1),'fd');
  s += T_(nx-50,iy-40,'θ₁','fx','middle')+T_(nx+36,iy+60,'θ₂','fx','middle')+T_(60,60,'αέρας (n ≈ 1)','ft')+T_(60,iy+36,'νερό (n ≈ 1,33)','ft');
  return FIG_('700 330', s, 'Η ακτίνα που περνά από τον αέρα στο νερό πλησιάζει την κάθετη (θ₂ < θ₁). Η διακεκομμένη ευθεία δείχνει τη διαδρομή χωρίς διάθλαση.');
}
const PTOL = [[10,8],[20,15.5],[30,22.5],[40,29],[50,35],[60,40.5],[70,45.5],[80,50]];
AN.ptolemy = [

 {h:'Επίκυκλοι και φορείς', html:`<p>Η Γη στο κέντρο, ο Ήλιος και οι πλανήτες γύρω της σε κύκλους. Οι πλανήτες όμως έχουν αναδρομές και αλλαγές φωτεινότητας. Ο Πτολεμαίος τις αναπαράστησε με επικύκλους: ο πλανήτης κινείται σε μικρό κύκλο, του οποίου το κέντρο διαγράφει τον φορέα.</p>${figEpicycle()}

 {h:'Διάθλαση του φωτός', html:`<p>Στα «Οπτικά» ο Πτολεμαίος μέτρησε με όργανο τις γωνίες διάθλασης στη διαχωριστική επιφάνεια αέρα–νερού για διάφορες γωνίες πρόσπτωσης και κατέγραψε τιμές σε πίνακες.</p>${figRefractP()}
  <div class="fm">n₁·ημθ₁ = n₂·ημθ₂<small>Νόμος του Σνελ (1621). Για αέρα n₁ ≈ 1 και για νερό n₂ ≈ 1,33.</small></div>

  ${CALC('ptolemy',[['θ₁',40,'°'],['n₂',1.333,'']], v => Math.asin(Math.sin(v[0]*Math.PI/180)/v[1])*180/Math.PI, 'θ₂ =','°')}
  <p>Οι τιμές του Πτολεμαίου είναι κοντά στις σωστές για μικρές γωνίες, ενώ για μεγάλες αποκλίνουν. Δεν βρήκε τον νόμο, αλλά έδειξε ότι η διάθλαση μπορεί να μετρηθεί και να δώσει τακτικούς αριθμούς.</p>`},

function gearPts(cx,cy,r,n,rot){
  const pts = [], da = 2*Math.PI/n;
  for (let i=0;i<n;i++){ const a = rot+i*da;
    [[-.32,r-6],[-.2,r+6],[.2,r+6],[.32,r-6]].forEach(q => pts.push([cx+q[1]*Math.cos(a+q[0]*da*1.4), cy+q[1]*Math.sin(a+q[0]*da*1.4)])); }
  return pts;
}
